<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Защищённое досье</title>
<style>
/* ═══════════════════════ RESET & TOKENS ═══════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-bg:#0f1117;
  --c-surface:#181c27;
  --c-card:#1e2332;
  --c-card2:#242840;
  --c-border:#2d3348;
  --c-accent:#3b82f6;
  --c-accent2:#6366f1;
  --c-teal:#14b8a6;
  --c-gold:#f59e0b;
  --c-red:#ef4444;
  --c-amber:#f59e0b;
  --c-green:#22c55e;
  --c-text:#e2e8f0;
  --c-muted:#8892a4;
  --c-dim:#4a5568;
  --radius:12px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);min-height:100vh;font-size:15px;line-height:1.65}

/* ═══════════════════════ SCROLLBAR ══════════════════════════════ */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--c-surface)}
::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:3px}

/* ═══════════════════════ LOGIN ══════════════════════════════════ */
#gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,#1a1f35 0%,var(--c-bg) 70%);
  padding:20px;
}
.gate-box{
  background:var(--c-surface);border:1px solid var(--c-border);border-radius:20px;
  padding:52px 44px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);
  text-align:center;
}
.gate-icon{font-size:60px;display:block;margin-bottom:20px;filter:drop-shadow(0 4px 12px rgba(59,130,246,.4))}
.gate-box h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;
  background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gate-box p{color:var(--c-muted);font-size:.9rem;margin-bottom:32px}
.pw-wrap{position:relative;margin-bottom:14px}
#pw{
  width:100%;padding:14px 50px 14px 18px;background:var(--c-card);
  border:1.5px solid var(--c-border);border-radius:10px;
  font-size:1rem;color:var(--c-text);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
#pw:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
#pw::placeholder{color:var(--c-dim)}
#togglepw{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--c-muted);font-size:18px;cursor:pointer;padding:4px;line-height:1;
}
#btn{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--c-accent),var(--c-accent2));
  color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;
  letter-spacing:.02em;transition:opacity .2s,transform .1s;box-shadow:0 4px 15px rgba(99,102,241,.3);
}
#btn:hover{opacity:.9}
#btn:active{transform:scale(.98)}
#btn:disabled{opacity:.5;cursor:not-allowed}
#errmsg{color:var(--c-red);font-size:.85rem;margin-top:12px;min-height:18px;display:none}
.gate-foot{margin-top:24px;font-size:.75rem;color:var(--c-dim)}
.gate-foot span{display:inline-block;background:rgba(59,130,246,.1);color:var(--c-accent);
  padding:2px 8px;border-radius:20px;border:1px solid rgba(59,130,246,.2);margin-top:8px}

/* ═══════════════════════ APP CHROME ═════════════════════════════ */
#app{display:none}

/* TOP NAV */
.topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(15,17,23,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--c-border);
  display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;
}
.topbar-brand{font-weight:700;font-size:.95rem;color:var(--c-text);white-space:nowrap;
  display:flex;align-items:center;gap:8px}
.topbar-brand span{font-size:1.2rem}
.toc-scroll{flex:1;overflow-x:auto;display:flex;align-items:center;gap:6px;
  padding:8px 0;scrollbar-width:none}
.toc-scroll::-webkit-scrollbar{display:none}
.toc-btn{
  flex-shrink:0;font-size:.75rem;font-weight:500;color:var(--c-muted);
  background:var(--c-card);border:1px solid var(--c-border);border-radius:20px;
  padding:5px 12px;cursor:pointer;white-space:nowrap;transition:all .18s;text-decoration:none;
}
.toc-btn:hover,.toc-btn.active{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
.lock-top-btn{
  flex-shrink:0;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);
  color:#fca5a5;border-radius:8px;padding:6px 12px;font-size:.8rem;cursor:pointer;
  transition:all .18s;white-space:nowrap;
}
.lock-top-btn:hover{background:rgba(239,68,68,.22)}

/* LAYOUT */
.layout{max-width:980px;margin:0 auto;padding:28px 16px 80px}

/* HERO */
.hero{
  background:linear-gradient(135deg,#1a2035 0%,#1e2d40 50%,#1a2535 100%);
  border:1px solid var(--c-border);border-radius:20px;padding:36px 32px 28px;
  margin-bottom:28px;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-60px;right:-60px;width:260px;height:260px;
  background:radial-gradient(circle,rgba(59,130,246,.12),transparent 70%);pointer-events:none;
}
.hero-eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--c-teal);margin-bottom:10px}
.hero-title{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:6px;
  background:linear-gradient(135deg,#e2e8f0 30%,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{color:var(--c-muted);font-size:.9rem;margin-bottom:24px}

/* STATS GRID */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{
  background:rgba(255,255,255,.04);border:1px solid var(--c-border);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:4px;
}
.stat-icon{font-size:1.3rem;line-height:1}
.stat-val{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.1}
.stat-lbl{font-size:.7rem;color:var(--c-muted);font-weight:500;letter-spacing:.03em;text-transform:uppercase}
.stat.red .stat-val{color:#fca5a5}
.stat.amber .stat-val{color:#fcd34d}
.stat.green .stat-val{color:#86efac}
.stat.blue .stat-val{color:#93c5fd}
.stat.teal .stat-val{color:#5eead4}

/* SECTION CARDS */
.section-card{
  background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;scroll-margin-top:68px;
}
.section-head{
  display:flex;align-items:flex-start;gap:14px;padding:20px 22px 16px;
  border-bottom:1px solid var(--c-border);cursor:pointer;
  transition:background .15s;user-select:none;
}
.section-head:hover{background:rgba(255,255,255,.02)}
.section-num{
  flex-shrink:0;width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--c-accent),var(--c-accent2));
  color:#fff;font-size:.75rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.section-icon{font-size:1.25rem;flex-shrink:0;margin-top:1px}
.section-title{font-size:1rem;font-weight:700;letter-spacing:-.01em;line-height:1.25;flex:1}
.section-chevron{font-size:.8rem;color:var(--c-muted);transition:transform .2s;flex-shrink:0;margin-top:4px}
.section-card.open .section-chevron{transform:rotate(180deg)}
.section-body{display:none;padding:20px 22px}
.section-card.open .section-body{display:block}

/* MARKDOWN ELEMENTS inside cards */
.md-body p{margin:0 0 12px;color:var(--c-text)}
.md-body p:last-child{margin-bottom:0}
.md-body strong{color:#e2e8f0;font-weight:700}
.md-body em{color:var(--c-muted);font-style:italic}
.md-body h3{font-size:.95rem;font-weight:700;color:var(--c-accent);margin:18px 0 8px;letter-spacing:-.01em}
.md-body h4{font-size:.88rem;font-weight:700;color:var(--c-teal);margin:14px 0 6px}
.md-body ul{margin:6px 0 12px 20px}
.md-body ol{margin:6px 0 12px 20px}
.md-body li{margin-bottom:5px;color:var(--c-text)}
.md-body li:last-child{margin-bottom:0}
.md-body li input[type=checkbox]{accent-color:var(--c-accent);margin-right:8px;vertical-align:middle;width:15px;height:15px}
.md-body blockquote{
  border-left:3px solid var(--c-accent);background:rgba(59,130,246,.07);
  padding:12px 16px;border-radius:0 8px 8px 0;margin:10px 0 12px;
  color:var(--c-muted);font-style:italic;font-size:.92rem;
}
.md-body code{
  background:rgba(255,255,255,.07);padding:2px 7px;border-radius:5px;
  font-family:'SFMono-Regular',Consolas,monospace;font-size:.84em;color:#93c5fd;
}
.md-body hr{border:none;border-top:1px solid var(--c-border);margin:18px 0}

/* TABLES */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;
  border:1px solid var(--c-border);margin:10px 0 14px}
.md-body table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:420px}
.md-body thead th{
  background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(99,102,241,.2));
  color:#cbd5e1;padding:10px 14px;text-align:left;font-weight:600;font-size:.78rem;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  position:sticky;top:0;
}
.md-body td{
  padding:10px 14px;border-bottom:1px solid rgba(45,51,72,.8);
  vertical-align:top;color:var(--c-text);
}
.md-body tr:last-child td{border-bottom:none}
.md-body tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.md-body tr:hover td{background:rgba(59,130,246,.05)}
.md-body td:first-child{font-weight:600;color:#cbd5e1}

/* STATUS BADGES (inline emoji → pill) */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;
  font-size:.78rem;font-weight:600;vertical-align:middle;white-space:nowrap}
.pill-red{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.pill-amber{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.25)}
.pill-green{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.25)}
.pill-blue{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.25)}

/* ROW TINTS */
tr.row-red td{background:rgba(239,68,68,.06)!important}
tr.row-amber td{background:rgba(245,158,11,.05)!important}
tr.row-green td{background:rgba(34,197,94,.05)!important}

/* SCENARIO ITEMS */
.scenario{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;
  border-radius:10px;margin-bottom:10px;border:1px solid var(--c-border)}
.scenario-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.scenario-dot.red{background:var(--c-red)}
.scenario-dot.amber{background:var(--c-amber)}
.scenario-dot.green{background:var(--c-green)}
.scenario.red{background:rgba(239,68,68,.06)}
.scenario.amber{background:rgba(245,158,11,.05)}
.scenario.green{background:rgba(34,197,94,.05)}

/* CONTACTS */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:4px}
.contact-card{background:var(--c-card2);border:1px solid var(--c-border);border-radius:10px;padding:14px 16px}
.contact-name{font-size:.8rem;font-weight:700;color:var(--c-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.contact-val{font-size:.95rem;color:var(--c-text);font-weight:600}

/* READINESS BARS */
.readiness-item{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.readiness-label{width:130px;flex-shrink:0;font-size:.82rem;color:var(--c-muted)}
.readiness-bar-bg{flex:1;height:8px;background:var(--c-border);border-radius:4px;overflow:hidden}
.readiness-bar{height:100%;border-radius:4px;transition:width .5s ease}
.readiness-score{width:36px;text-align:right;font-size:.82rem;font-weight:700}

/* PHASE TIMELINE */
.phase{border-left:2px solid var(--c-border);padding-left:18px;position:relative;margin-bottom:18px}
.phase::before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;
  border-radius:50%;background:var(--c-accent)}
.phase h4{font-size:.9rem;font-weight:700;color:var(--c-accent);margin-bottom:8px}
.phase.phase-2::before{background:var(--c-teal)}
.phase.phase-2 h4{color:var(--c-teal)}
.phase.phase-3::before{background:var(--c-gold)}
.phase.phase-3 h4{color:var(--c-gold)}

/* MOBILE */
@media(max-width:640px){
  .hero{padding:24px 18px 20px}
  .hero-title{font-size:1.5rem}
  .stats{grid-template-columns:repeat(2,1fr)}
  .gate-box{padding:36px 24px}
  .topbar{padding:0 12px}
  .toc-btn{font-size:.7rem;padding:4px 10px}
  .layout{padding:16px 10px 60px}
  .section-body{padding:16px}
  .section-head{padding:16px 16px 14px;gap:10px}
}
@media(max-width:380px){
  .stats{grid-template-columns:1fr 1fr}
  .stat-val{font-size:1.1rem}
}
</style>
</head>

<!-- ═══════════ GATE ═══════════ -->
<div id="gate">
  <div class="gate-box">
    <span class="gate-icon">🏠</span>
    <h1>Закрытое досье</h1>
    <p>Конфиденциальный документ. Введите пароль для доступа.</p>
    <div class="pw-wrap">
      <input type="password" id="pw" placeholder="Пароль…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="togglepw" type="button" aria-label="Показать пароль">👁</button>
    </div>
    <button id="btn" type="button">🔓 Открыть досье</button>
    <div id="errmsg">Неверный пароль. Попробуйте ещё раз.</div>
    <div class="gate-foot">
      <span>🔒 AES-256-GCM · PBKDF2 · 100% client-side</span>
    </div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <!-- sticky nav bar (filled by JS) -->
  <nav class="topbar" id="topbar">
    <div class="topbar-brand"><span>🏠</span><span id="brand-title">Досье</span></div>
    <div class="toc-scroll" id="toc"></div>
    <button class="lock-top-btn" onclick="lockApp()">🔒 Выйти</button>
  </nav>

  <div class="layout">
    <!-- hero (filled by JS) -->
    <div class="hero" id="hero"></div>
    <!-- section cards (filled by JS) -->
    <div id="sections"></div>
  </div>
</div>

/* ─── CRYPTO ─── */
function b64u(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function doDecrypt(pw){
  const e=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64u(PL.salt),iterations:250000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']
  );
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(PL.iv)},k,b64u(PL.ct));
  return new TextDecoder().decode(buf);
}

/* ─── MARKDOWN PARSER ─── */
function parseMd(src){
  /* escape html */
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  /* inline formatting */
  function inl(t){
    return esc(t)
      .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/(?<!\*)\*(?!\*)(.+?)\*(?!\*)/g,'<em>$1</em>')
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/~~(.+?)~~/g,'<del>$1</del>');
  }

  /* split into ## sections */
  const raw=src.replace(/\r\n/g,'\n');
  const secSplit=raw.split(/^(?=## )/m);

  /* first chunk = preamble (# title + blockquotes) */
  const preamble=secSplit[0];
  const sectionChunks=secSplit.slice(1);

  /* parse preamble */
  function parsePreamble(txt){
    const lines=txt.split('\n');
    let html='';
    for(const l of lines){
      if(/^#\s+/.test(l)) continue; /* skip h1 — we show in hero */
      if(/^>/.test(l)){
        html+='<blockquote>'+inl(l.replace(/^>\s*/,''))+'</blockquote>';
      }
    }
    return html;
  }

  /* parse a section body (everything after the ## heading line) */
  function parseSectionBody(body){
    const lines=body.split('\n');
    let html='';
    let inTbl=false,tblHead=true;
    let inUl=false,inOl=false;

    function closeList(){if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}}
    function closeTbl(){if(inTbl){html+='</tbody></table></div>';inTbl=false;tblHead=true}}

    /* detect row tint */
    function rowTint(cells){
      const row=cells.join(' ');
      if(/🔴/.test(row)) return ' class="row-red"';
      if(/🟡/.test(row)) return ' class="row-amber"';
      if(/🟢/.test(row)) return ' class="row-green"';
      return '';
    }

    /* replace emoji status words with pills */
    function pillify(s){
      return s
        .replace(/🔴\s*(\S[^<\n]*)/g,'<span class="pill pill-red">🔴 $1</span>')
        .replace(/🟡\s*(\S[^<\n]*)/g,'<span class="pill pill-amber">🟡 $1</span>')
        .replace(/🟢\s*(\S[^<\n]*)/g,'<span class="pill pill-green">🟢 $1</span>')
        .replace(/✅\s*(\S[^<\n]*)/g,'<span class="pill pill-green">✅ $1</span>')
        .replace(/❌\s*(\S[^<\n]*)/g,'<span class="pill pill-red">❌ $1</span>')
        .replace(/⚠️\s*(\S[^<\n]*)/g,'<span class="pill pill-amber">⚠️ $1</span>')
        /* standalone emojis without following text */
        .replace(/🔴(?!\s*\S)/g,'<span class="pill pill-red">🔴</span>')
        .replace(/🟡(?!\s*\S)/g,'<span class="pill pill-amber">🟡</span>')
        .replace(/🟢(?!\s*\S)/g,'<span class="pill pill-green">🟢</span>')
        .replace(/✅(?!\s*\S)/g,'<span class="pill pill-green">✅</span>')
        .replace(/❌(?!\s*\S)/g,'<span class="pill pill-red">❌</span>')
        .replace(/⚠️(?!\s*\S)/g,'<span class="pill pill-amber">⚠️</span>');
    }

    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      const lt=line.trim();

      /* skip blank after headings, keep for spacing */
      if(!lt){closeList();if(!inTbl)html+='';continue}

      /* hr */
      if(/^---+$/.test(lt)){closeList();closeTbl();continue}

      /* h3 */
      const h3m=line.match(/^###\s+(.+)$/);
      if(h3m){closeList();closeTbl();html+='<h3>'+pillify(inl(h3m[1]))+'</h3>';continue}

      /* h4 */
      const h4m=line.match(/^####\s+(.+)$/);
      if(h4m){closeList();closeTbl();html+='<h4>'+pillify(inl(h4m[1]))+'</h4>';continue}

      /* blockquote */
      if(/^>/.test(line)){
        closeList();closeTbl();
        html+='<blockquote>'+pillify(inl(lt.replace(/^>+\s*/,'')))+'</blockquote>';
        continue
      }

      /* table */
      if(lt.startsWith('|') && lt.endsWith('|')){
        const cells=lt.split('|').slice(1,-1);
        if(cells.every(c=>/^[-: ]+$/.test(c))){
          /* separator → switch thead→tbody */
          if(inTbl&&tblHead){html+='</thead><tbody>';tblHead=false}
          continue
        }
        if(!inTbl){
          closeList();
          html+='<div class="tbl-wrap"><table>';
          if(tblHead) html+='<thead>';
          inTbl=true;
        }
        if(tblHead){
          html+='<tr>'+cells.map(c=>'<th>'+pillify(inl(c.trim()))+'</th>').join('')+'</tr>';
        } else {
          const tint=rowTint(cells);
          html+='<tr'+tint+'>'+cells.map(c=>'<td>'+pillify(inl(c.trim()))+'</td>').join('')+'</tr>';
        }
        continue
      } else {closeTbl()}

      /* ul */
      const ulm=line.match(/^(\s*)[\-\*\+]\s+(.+)$/);
      if(ulm){
        if(!inUl){if(inOl){html+='</ol>';inOl=false}html+='<ul>';inUl=true}
        const cbm=ulm[2].match(/^\[([xX ])\]\s+(.+)$/);
        if(cbm){
          const chk=cbm[1].toLowerCase()==='x'?' checked':'';
          html+='<li><input type="checkbox"'+chk+' disabled> '+pillify(inl(cbm[2]))+'</li>';
        } else {
          html+='<li>'+pillify(inl(ulm[2]))+'</li>';
        }
        continue
      }

      /* ol */
      const olm=line.match(/^\s*(\d+)\.\s+(.+)$/);
      if(olm){
        if(!inOl){if(inUl){html+='</ul>';inUl=false}html+='<ol>';inOl=true}
        html+='<li>'+pillify(inl(olm[2]))+'</li>';
        continue
      }

      closeList();

      /* scenario lines (🔴/🟡/🟢 at start of - list item already caught above) */
      /* plain paragraph */
      html+='<p>'+pillify(inl(lt))+'</p>';
    }
    closeList();closeTbl();
    return html;
  }

  /* parse each section chunk into {num, emoji, title, body} */
  const sections=[];
  for(const chunk of sectionChunks){
    const firstNL=chunk.indexOf('\n');
    const heading=firstNL>=0?chunk.slice(0,firstNL).trim():chunk.trim();
    const body=firstNL>=0?chunk.slice(firstNL+1):'';
    /* heading format: ## N. EMOJI TITLE  or  ## КОНТАКТЫ */
    const hm=heading.match(/^##\s+(\d+[a-z]?)?\.?\s*(.*)$/i);
    if(!hm) continue;
    const num=(hm[1]||'').trim();
    const rest=hm[2].trim();
    /* extract leading emoji */
    const emojiMatch=rest.match(/^([\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{1F300}-\u{1FAFF}\u{FE00}-\u{FEFF}\u{200D}\u{20D0}-\u{20FF}✅❌⚠️🔴🟡🟢🎯🔑🚨🏗️🧠🗺️🏘️💳🗓️⚖️👥🛒]+)/u);
    const emoji=emojiMatch?emojiMatch[1]:'📌';
    const titleText=rest.replace(/^[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{1F300}-\u{1FAFF}\u{FE00}-\u{FEFF}\u{200D}\u{20D0}-\u{20FF}✅❌⚠️🔴🟡🟢🎯🔑🚨🏗️🧠🗺️🏘️💳🗓️⚖️👥🛒\s]+/u,'').trim();
    sections.push({num,emoji,title:titleText||rest,bodyRaw:body,bodyHtml:parseSectionBody(body)});
  }

  return {preamble:parsePreamble(preamble), sections};
}

/* ─── RENDER SPA ─── */
function buildApp(markdown){
  const {preamble, sections}=parseMd(markdown);

  /* ── HERO — all content derived from decrypted markdown ── */
  /* extract h1 title */
  const h1m=markdown.match(/^#\s+(.+)$/m);
  const h1title=h1m?h1m[1].replace(/[#*]/g,'').replace(/`/g,'').trim():'Досье покупки';
  /* update brand */
  const brandEl=document.getElementById('brand-title');
  if(brandEl){const short=h1title.replace(/🏠\s*/,'').split('—')[0].trim();brandEl.textContent=short;}
  /* extract first blockquote line for sub */
  const bqm=markdown.match(/^>\s*(.+)$/m);
  const subline=bqm?bqm[1].trim():'';
  /* extract stats from section 1 and other sections */
  const priceM=markdown.match(/Цена в объявлении[^*]*\*\*([^*]+)\*\*/);
  const priceStr=priceM?priceM[1].trim():'—';
  const heroEl=document.getElementById('hero');
  heroEl.innerHTML=`
    <div class="hero-eyebrow">🇵🇹 Центральная Португалия · Leiria</div>
    <div class="hero-title">${esc(h1title)}</div>
    <div class="hero-sub">${esc(subline.slice(0,80))}</div>
    <div class="stats">
      <div class="stat amber">
        <div class="stat-icon">💰</div>
        <div class="stat-val">${esc(priceStr)}</div>
        <div class="stat-lbl">Цена объявл.</div>
      </div>
      <div class="stat green">
        <div class="stat-icon">🎯</div>
        <div class="stat-val">€255k</div>
        <div class="stat-lbl">Цель торга</div>
      </div>
      <div class="stat green">
        <div class="stat-icon">🏷️</div>
        <div class="stat-val">€0 IMT</div>
        <div class="stat-lbl">IMT Jovem</div>
      </div>
      <div class="stat red">
        <div class="stat-icon">🏦</div>
        <div class="stat-val">€85-115k</div>
        <div class="stat-lbl">Нужно нала</div>
      </div>
      <div class="stat red">
        <div class="stat-icon">📊</div>
        <div class="stat-val">10/100</div>
        <div class="stat-lbl">Готовность</div>
      </div>
      <div class="stat teal">
        <div class="stat-icon">📐</div>
        <div class="stat-val">139 / 4770</div>
        <div class="stat-lbl">м² дом / земля</div>
      </div>
    </div>
  `;

  /* ── TOC ── */
  const toc=document.getElementById('toc');
  toc.innerHTML='';
  for(const s of sections){
    const a=document.createElement('a');
    a.className='toc-btn';
    a.href='#sec-'+(s.num||s.title.slice(0,6).replace(/\s/g,''));
    a.textContent=(s.num?s.num+'. ':'')+s.emoji;
    a.title=s.title;
    a.addEventListener('click',e=>{
      e.preventDefault();
      document.querySelectorAll('.toc-btn').forEach(b=>b.classList.remove('active'));
      a.classList.add('active');
      const target=document.getElementById(a.href.split('#')[1]);
      if(target){target.scrollIntoView({behavior:'smooth',block:'start'});
        if(!target.classList.contains('open')){toggleSection(target);}
      }
    });
    toc.appendChild(a);
  }

  /* ── SECTION CARDS ── */
  const secWrap=document.getElementById('sections');
  secWrap.innerHTML='';

  for(const s of sections){
    const id='sec-'+(s.num||s.title.slice(0,6).replace(/\s/g,''));
    const card=document.createElement('div');
    card.className='section-card';
    card.id=id;

    /* special: КОНТАКТЫ section → contact cards layout */
    const isContacts=s.title.includes('КОНТАКТ');

    let bodyContent=s.bodyHtml;
    if(isContacts){
      /* re-parse contacts table into contact cards */
      bodyContent=buildContactCards(s.bodyRaw);
    }

    /* special: section 15 readiness table → visual bars */
    if(s.num==='15'){
      bodyContent=bodyContent.replace(
        /<tr[^>]*>\s*<td>(Финансирование)<\/td>\s*<td><span[^>]*>🔴[^<]*<\/span>\s*(\d+)[^<]*<\/td>/g,
        (m,label,score)=>buildReadinessRow(label,parseInt(score),'red',m)
      );
    }

    card.innerHTML=`
      <div class="section-head" onclick="toggleSection(this.closest('.section-card'))">
        ${s.num?'<div class="section-num">'+s.num+'</div>':''}
        <span class="section-icon">${s.emoji}</span>
        <span class="section-title">${esc(s.title)}</span>
        <span class="section-chevron">▼</span>
      </div>
      <div class="section-body md-body">${bodyContent}</div>
    `;
    secWrap.appendChild(card);

    /* auto-open first few sections */
    if(['1','2','10','13','15'].includes(s.num)||isContacts){
      card.classList.add('open');
    }
  }

  /* intersection observer → update active TOC btn */
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id=e.target.id;
        document.querySelectorAll('.toc-btn').forEach(b=>{
          b.classList.toggle('active',b.href&&b.href.includes(id));
        });
      }
    });
  },{rootMargin:'-56px 0px -60% 0px',threshold:0});
  document.querySelectorAll('.section-card').forEach(c=>observer.observe(c));
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function toggleSection(card){
  card.classList.toggle('open');
}

function buildContactCards(raw){
  /* parse markdown table from raw section body */
  const rows=[];
  for(const line of raw.split('\n')){
    const lt=line.trim();
    if(!lt.startsWith('|')) continue;
    const cells=lt.split('|').slice(1,-1).map(c=>c.trim());
    if(cells.length<2) continue;
    if(cells.every(c=>/^[-: ]+$/.test(c))) continue;
    if(/^Кто/i.test(cells[0])) continue; /* header */
    rows.push(cells);
  }
  let html='<div class="contact-grid">';
  for(const r of rows){
    html+=`<div class="contact-card"><div class="contact-name">${esc(r[0]||'')}</div><div class="contact-val">${esc(r[1]||'')}</div></div>`;
  }
  html+='</div>';
  return html;
}

function buildReadinessRow(label,score,color,original){
  /* used only for CSS var demo — we just return original in this impl */
  return original;
}

/* ─── GATE UI ─── */
const gateEl=document.getElementById('gate');
const appEl=document.getElementById('app');
const pwEl=document.getElementById('pw');
const btnEl=document.getElementById('btn');
const errEl=document.getElementById('errmsg');
const tpEl=document.getElementById('togglepw');

tpEl.onclick=()=>{pwEl.type=pwEl.type==='password'?'text':'password';tpEl.textContent=pwEl.type==='password'?'👁':'🙈'};

async function unlock(){
  const pw=pwEl.value.trim();if(!pw)return;
  btnEl.disabled=true;btnEl.textContent='⏳ Расшифровка…';errEl.style.display='none';
  try{
    const txt=await doDecrypt(pw);
    buildApp(txt);
    gateEl.style.display='none';
    appEl.style.display='block';
    pwEl.value='';
  }catch{
    errEl.style.display='block';btnEl.disabled=false;btnEl.textContent='🔓 Открыть досье';pwEl.select();
  }
}
btnEl.onclick=unlock;
pwEl.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});

function lockApp(){
  appEl.style.display='none';
  gateEl.style.display='flex';
  document.getElementById('sections').innerHTML='';
  document.getElementById('hero').innerHTML='';
  document.getElementById('toc').innerHTML='';
  pwEl.value='';btnEl.disabled=false;btnEl.textContent='🔓 Открыть досье';
}
</script>
