<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Защищённое досье</title>
<style>
  :root {
    --bg: #f8f5f0;
    --surface: #ffffff;
    --accent: #b5602a;
    --accent2: #7a4020;
    --text: #2c2c2c;
    --muted: #6b6b6b;
    --border: #e2d9ce;
    --shadow: rgba(0,0,0,0.08);
    --success: #2d6a4f;
    --error: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2c1810 0%, #5c3320 50%, #8b4513 100%);
    padding: 20px;
  }
  .login-box {
    background: var(--surface);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  .login-icon { font-size: 56px; margin-bottom: 16px; display: block; }
  .login-box h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent2); margin-bottom: 8px; }
  .login-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
  .pw-wrap { position: relative; margin-bottom: 16px; }
  #pw-input {
    width: 100%;
    padding: 14px 48px 14px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    background: #fafafa;
  }
  #pw-input:focus { border-color: var(--accent); background: white; }
  #toggle-pw {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    cursor: pointer; color: var(--muted); font-size: 18px;
    background: none; border: none; padding: 0; line-height: 1;
  }
  #unlock-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s; letter-spacing: 0.03em;
  }
  #unlock-btn:hover { opacity: 0.92; }
  #unlock-btn:active { transform: scale(0.98); }
  #unlock-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  #error-msg { color: var(--error); font-size: 0.88rem; margin-top: 12px; min-height: 20px; display: none; }
  .login-footer { margin-top: 24px; font-size: 0.78rem; color: #bbb; }

  /* ── CONTENT ── */
  #content { display: none; }
  .site-header {
    background: linear-gradient(135deg, #2c1810 0%, #5c3320 100%);
    color: white; padding: 32px 24px 28px; text-align: center;
  }
  .site-header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
  .site-header .subtitle { opacity: 0.75; font-size: 0.95rem; }
  .badge {
    display: inline-block; background: rgba(255,255,255,0.15);
    border-radius: 20px; padding: 3px 12px; font-size: 0.8rem;
    margin-top: 8px; backdrop-filter: blur(4px);
  }
  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

  /* Markdown */
  .md-content h1 {
    font-size: 1.9rem; font-weight: 800; color: var(--accent2);
    border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin: 32px 0 20px;
  }
  .md-content h2 {
    font-size: 1.35rem; font-weight: 700; color: var(--accent2);
    margin: 36px 0 14px; padding: 10px 16px;
    background: linear-gradient(90deg, #f0e8de, transparent);
    border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0;
  }
  .md-content h3 { font-size: 1.1rem; font-weight: 700; color: var(--text); margin: 24px 0 10px; }
  .md-content p { margin: 0 0 14px; color: var(--text); }
  .md-content strong { color: var(--accent2); font-weight: 700; }
  .md-content em { font-style: italic; color: var(--muted); }
  .md-content ul, .md-content ol { margin: 0 0 14px 24px; }
  .md-content li { margin-bottom: 6px; }
  .md-content li input[type="checkbox"] {
    margin-right: 8px; accent-color: var(--accent);
    width: 16px; height: 16px; vertical-align: middle;
  }
  .md-content blockquote {
    border-left: 4px solid var(--accent); background: #fef9f5;
    padding: 12px 18px; margin: 16px 0; border-radius: 0 8px 8px 0;
    color: var(--muted); font-style: italic;
  }
  .md-content hr { border: none; border-top: 2px solid var(--border); margin: 32px 0; }
  .md-content code {
    background: #f0e8de; padding: 2px 6px; border-radius: 4px;
    font-family: monospace; font-size: 0.9em; color: var(--accent2);
  }

  /* Tables */
  .md-content table {
    width: 100%; border-collapse: collapse; margin: 16px 0 24px;
    font-size: 0.92rem; background: var(--surface);
    border-radius: 10px; overflow: hidden; box-shadow: 0 2px 12px var(--shadow);
  }
  .md-content th {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: white; padding: 12px 16px; text-align: left; font-weight: 600;
  }
  .md-content td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .md-content tr:last-child td { border-bottom: none; }
  .md-content tr:nth-child(even) td { background: #fdf8f4; }
  .md-content tr:hover td { background: #f5ede3; transition: background 0.15s; }

  /* Lock FAB */
  .lock-btn {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--accent2); color: white; border: none;
    border-radius: 50%; width: 52px; height: 52px;
    font-size: 22px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    transition: transform 0.2s, opacity 0.2s; z-index: 100;
  }
  .lock-btn:hover { transform: scale(1.1); }

  @media (max-width: 600px) {
    .login-box { padding: 32px 24px; }
    .md-content h1 { font-size: 1.5rem; }
    .md-content h2 { font-size: 1.15rem; }
    .md-content table { font-size: 0.82rem; }
    .md-content th, .md-content td { padding: 8px 10px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <span class="login-icon">🏠</span>
    <h1>Закрытое досье</h1>
    <p>Защищённый документ. Введите пароль для доступа.</p>
    <div class="pw-wrap">
      <input type="password" id="pw-input" placeholder="Пароль..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="toggle-pw" type="button" title="Показать/скрыть" aria-label="Toggle password visibility">👁</button>
    </div>
    <button id="unlock-btn" type="button">🔓 Открыть досье</button>
    <div id="error-msg">Неверный пароль. Попробуйте ещё раз.</div>
    <div class="login-footer">🔒 Контент зашифрован AES-256-GCM · расшифровка только в браузере</div>
  </div>
</div>

<!-- CONTENT -->
<div id="content">

    <h1>🏠 Защищённое досье</h1>

    <div class="md-content" id="md-output"></div>
  </div>
  <button class="lock-btn" onclick="lockSite()" title="Заблокировать">🔒</button>
</div>

// ── CRYPTO ──
function b64ToBytes(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}

async function decryptPayload(password) {
  const enc  = new TextEncoder();
  const salt = b64ToBytes(PAYLOAD.salt);
  const iv   = b64ToBytes(PAYLOAD.iv);
  const ct   = b64ToBytes(PAYLOAD.ct);
  const km   = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key  = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(plain);
}

function renderMarkdown(md) {
  let html = md
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  const lines = html.split('\n');
  const out = [];
  let inTable = false, tableHeader = false, inUl = false, inOl = false;

  function closeList() {
    if (inUl) { out.push('</ul>'); inUl = false; }
    if (inOl) { out.push('</ol>'); inOl = false; }
  }
  function closeTable() {
    if (inTable) { out.push('</tbody></table>'); inTable = false; tableHeader = false; }
  }

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    if (/^---+$/.test(line.trim())) { closeList(); closeTable(); out.push('<hr>'); continue; }

    const hm = line.match(/^(#{1,6})\s+(.+)$/);
    if (hm) {
      closeList(); closeTable();
      const lvl = hm[1].length;
      out.push('<h' + lvl + '>' + inlineFormat(hm[2]) + '</h' + lvl + '>');
      continue;
    }

    if (line.startsWith('&gt;')) {
      closeList(); closeTable();
      out.push('<blockquote>' + inlineFormat(line.replace(/^(&gt;\s*)+/, '')) + '</blockquote>');
      continue;
    }

    // Table
    if (line.includes('|') && line.trim().startsWith('|')) {
      const cells = line.trim().split('|').filter((_, i, a) => i > 0 && i < a.length - 1);
      if (cells.every(c => /^[-: ]+$/.test(c))) {
        // separator — switch from thead to tbody
        if (inTable && tableHeader) { out.push('</thead><tbody>'); tableHeader = false; }
        continue;
      }
      if (!inTable) {
        closeList();
        out.push('<table><thead>');
        inTable = true; tableHeader = true;
      }
      const tag = tableHeader ? 'th' : 'td';
      out.push('<tr>' + cells.map(c => '<' + tag + '>' + inlineFormat(c.trim()) + '</' + tag + '>').join('') + '</tr>');
      continue;
    } else { closeTable(); }

    // Unordered list
    const ulM = line.match(/^(\s*)[\-\*\+]\s+(.+)$/);
    if (ulM) {
      if (!inUl) { if (inOl) { out.push('</ol>'); inOl = false; } out.push('<ul>'); inUl = true; }
      const cbM = ulM[2].match(/^\[([xX ])\]\s+(.+)$/);
      if (cbM) {
        const chk = cbM[1].toLowerCase() === 'x' ? 'checked' : '';
        out.push('<li><input type="checkbox" ' + chk + ' disabled> ' + inlineFormat(cbM[2]) + '</li>');
      } else {
        out.push('<li>' + inlineFormat(ulM[2]) + '</li>');
      }
      continue;
    }

    // Ordered list
    const olM = line.match(/^\s*\d+\.\s+(.+)$/);
    if (olM) {
      if (!inOl) { if (inUl) { out.push('</ul>'); inUl = false; } out.push('<ol>'); inOl = true; }
      out.push('<li>' + inlineFormat(olM[1]) + '</li>');
      continue;
    }

    closeList();
    if (line.trim() === '') { out.push(''); continue; }
    out.push('<p>' + inlineFormat(line) + '</p>');
  }
  closeList(); closeTable();
  return out.join('\n');
}

function inlineFormat(t) {
  return t
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>');
}

// ── UI ──
const loginScreen = document.getElementById('login-screen');
const contentDiv  = document.getElementById('content');
const pwInput     = document.getElementById('pw-input');
const unlockBtn   = document.getElementById('unlock-btn');
const errorMsg    = document.getElementById('error-msg');
const mdOutput    = document.getElementById('md-output');
const togglePwBtn = document.getElementById('toggle-pw');

togglePwBtn.addEventListener('click', () => {
  pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
  togglePwBtn.textContent = pwInput.type === 'password' ? '👁' : '🙈';
});

async function unlock() {
  const pw = pwInput.value.trim();
  if (!pw) return;
  unlockBtn.disabled = true;
  unlockBtn.textContent = '⏳ Расшифровка...';
  errorMsg.style.display = 'none';
  try {
    const plaintext = await decryptPayload(pw);
    mdOutput.innerHTML = renderMarkdown(plaintext);
    loginScreen.style.display = 'none';
    contentDiv.style.display = 'block';
    window.scrollTo(0, 0);
    pwInput.value = '';
  } catch {
    errorMsg.style.display = 'block';
    unlockBtn.disabled = false;
    unlockBtn.textContent = '🔓 Открыть досье';
    pwInput.select();
  }
}

unlockBtn.addEventListener('click', unlock);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

function lockSite() {
  contentDiv.style.display = 'none';
  loginScreen.style.display = 'flex';
  mdOutput.innerHTML = '';
  pwInput.value = '';
  unlockBtn.textContent = '🔓 Открыть досье';
}
</script>
