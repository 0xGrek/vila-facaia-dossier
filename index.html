<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Защищённое досье</title>
<style>
  :root{--bg:#f8f5f0;--surface:#fff;--accent:#b5602a;--accent2:#7a4020;--text:#2c2c2c;--muted:#6b6b6b;--border:#e2d9ce;--shadow:rgba(0,0,0,.08);--error:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7}

  /* LOGIN */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2c1810,#5c3320 50%,#8b4513);padding:20px}
  .login-box{background:#fff;border-radius:16px;padding:48px 40px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
  .login-icon{font-size:56px;margin-bottom:16px;display:block}
  .login-box h1{font-size:1.5rem;font-weight:700;color:var(--accent2);margin-bottom:8px}
  .login-box p{color:var(--muted);font-size:.9rem;margin-bottom:28px}
  .pw-wrap{position:relative;margin-bottom:16px}
  #pw-input{width:100%;padding:14px 48px 14px 16px;border:2px solid var(--border);border-radius:10px;font-size:1rem;outline:none;transition:border-color .2s;background:#fafafa}
  #pw-input:focus{border-color:var(--accent);background:#fff}
  #toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--muted);font-size:18px;background:none;border:none;padding:0}
  #unlock-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:.03em}
  #unlock-btn:hover{opacity:.92}
  #unlock-btn:active{transform:scale(.98)}
  #unlock-btn:disabled{opacity:.6;cursor:not-allowed}
  #error-msg{color:var(--error);font-size:.88rem;margin-top:12px;min-height:20px;display:none}
  .login-footer{margin-top:24px;font-size:.78rem;color:#bbb}

  /* CONTENT */
  #content{display:none}
  .site-header{background:linear-gradient(135deg,#2c1810,#5c3320);color:#fff;padding:32px 24px 28px;text-align:center}
  .site-header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
  .site-header .subtitle{opacity:.75;font-size:.95rem}
  .badge{display:inline-block;background:rgba(255,255,255,.15);border-radius:20px;padding:3px 12px;font-size:.8rem;margin-top:8px;backdrop-filter:blur(4px)}
  .container{max-width:900px;margin:0 auto;padding:24px 16px 60px}

  /* MARKDOWN */
  .md h1{font-size:1.9rem;font-weight:800;color:var(--accent2);border-bottom:3px solid var(--accent);padding-bottom:10px;margin:32px 0 20px}
  .md h2{font-size:1.35rem;font-weight:700;color:var(--accent2);margin:36px 0 14px;padding:10px 16px;background:linear-gradient(90deg,#f0e8de,transparent);border-left:4px solid var(--accent);border-radius:0 8px 8px 0}
  .md h3{font-size:1.1rem;font-weight:700;color:var(--text);margin:24px 0 10px}
  .md p{margin:0 0 14px}
  .md strong{color:var(--accent2);font-weight:700}
  .md em{font-style:italic;color:var(--muted)}
  .md ul,.md ol{margin:0 0 14px 24px}
  .md li{margin-bottom:6px}
  .md li input[type=checkbox]{margin-right:8px;accent-color:var(--accent);width:16px;height:16px;vertical-align:middle}
  .md blockquote{border-left:4px solid var(--accent);background:#fef9f5;padding:12px 18px;margin:16px 0;border-radius:0 8px 8px 0;color:var(--muted);font-style:italic}
  .md hr{border:none;border-top:2px solid var(--border);margin:32px 0}
  .md code{background:#f0e8de;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:.9em;color:var(--accent2)}
  .md table{width:100%;border-collapse:collapse;margin:16px 0 24px;font-size:.92rem;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px var(--shadow)}
  .md th{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;padding:12px 16px;text-align:left;font-weight:600}
  .md td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:top}
  .md tr:last-child td{border-bottom:none}
  .md tr:nth-child(even) td{background:#fdf8f4}
  .md tr:hover td{background:#f5ede3;transition:background .15s}

  /* FAB */
  .lock-btn{position:fixed;bottom:24px;right:24px;background:var(--accent2);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .2s;z-index:100}
  .lock-btn:hover{transform:scale(1.1)}

  @media(max-width:600px){
    .login-box{padding:32px 24px}
    .md h1{font-size:1.5rem}
    .md h2{font-size:1.15rem}
    .md table{font-size:.82rem}
    .md th,.md td{padding:8px 10px}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <span class="login-icon">🏠</span>
    <h1>Закрытое досье</h1>
    <p>Защищённый документ. Введите пароль для доступа.</p>
    <div class="pw-wrap">
      <input type="password" id="pw-input" placeholder="Пароль..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="toggle-pw" type="button" aria-label="Toggle">👁</button>
    </div>
    <button id="unlock-btn" type="button">🔓 Открыть досье</button>
    <div id="error-msg">Неверный пароль. Попробуйте ещё раз.</div>
    <div class="login-footer">🔒 AES-256-GCM · PBKDF2 · расшифровка только в браузере</div>
  </div>
</div>

<div id="content">
  <div class="site-header">
    <h1>🏠 Защищённое досье</h1>
    <div class="subtitle">Конфиденциальный документ · 06.2026</div>
    <span class="badge">🔐 Расшифровано локально · AES-256-GCM</span>
  </div>
  <div class="container">
    <div class="md" id="md-out"></div>
  </div>
  <button class="lock-btn" onclick="lock()" title="Заблокировать">🔒</button>
</div>

function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

async function decrypt(pw){
  const e=new TextEncoder(),sa=b64(P.salt),iv=b64(P.iv),ct=b64(P.ct);
  const km=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:sa,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct));
}

/* Mini markdown renderer */
function md(src){
  let h=src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const L=h.split('\n'),o=[];
  let tbl=false,th=false,ul=false,ol=false;
  const cul=()=>{if(ul){o.push('</ul>');ul=false}if(ol){o.push('</ol>');ol=false}};
  const ctbl=()=>{if(tbl){o.push('</tbody></table>');tbl=false;th=false}};
  const inf=t=>t
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/~~(.+?)~~/g,'<del>$1</del>');
  for(const line of L){
    if(/^---+$/.test(line.trim())){cul();ctbl();o.push('<hr>');continue}
    const hm=line.match(/^(#{1,6})\s+(.+)$/);
    if(hm){cul();ctbl();const lv=hm[1].length;o.push('<h'+lv+'>'+inf(hm[2])+'</h'+lv+'>');continue}
    if(line.startsWith('&gt;')){cul();ctbl();o.push('<blockquote>'+inf(line.replace(/^(&gt;\s*)+/,''))+'</blockquote>');continue}
    if(line.includes('|')&&line.trim().startsWith('|')){
      const cells=line.trim().split('|').filter((_,i,a)=>i>0&&i<a.length-1);
      if(cells.every(c=>/^[-: ]+$/.test(c))){if(tbl&&th){o.push('</thead><tbody>');th=false}continue}
      if(!tbl){cul();o.push('<table><thead>');tbl=true;th=true}
      const tag=th?'th':'td';
      o.push('<tr>'+cells.map(c=>'<'+tag+'>'+inf(c.trim())+'</'+tag+'>').join('')+'</tr>');
      continue
    }else ctbl();
    const um=line.match(/^\s*[\-\*\+]\s+(.+)$/);
    if(um){
      if(!ul){if(ol){o.push('</ol>');ol=false}o.push('<ul>');ul=true}
      const cb=um[1].match(/^\[([xX ])\]\s+(.+)$/);
      o.push(cb?'<li><input type="checkbox"'+(cb[1].toLowerCase()==='x'?' checked':'')+' disabled> '+inf(cb[2])+'</li>':'<li>'+inf(um[1])+'</li>');
      continue
    }
    const om=line.match(/^\s*\d+\.\s+(.+)$/);
    if(om){if(!ol){if(ul){o.push('</ul>');ul=false}o.push('<ol>');ol=true}o.push('<li>'+inf(om[1])+'</li>');continue}
    cul();
    if(!line.trim()){o.push('');continue}
    o.push('<p>'+inf(line)+'</p>');
  }
  cul();ctbl();
  return o.join('\n');
}

/* UI */
const LS=document.getElementById('login-screen'),
      CV=document.getElementById('content'),
      PW=document.getElementById('pw-input'),
      UB=document.getElementById('unlock-btn'),
      EM=document.getElementById('error-msg'),
      MO=document.getElementById('md-out'),
      TP=document.getElementById('toggle-pw');

TP.onclick=()=>{PW.type=PW.type==='password'?'text':'password';TP.textContent=PW.type==='password'?'👁':'🙈'};

async function unlock(){
  const pw=PW.value.trim();if(!pw)return;
  UB.disabled=true;UB.textContent='⏳ Расшифровка...';EM.style.display='none';
  try{
    const txt=await decrypt(pw);
    MO.innerHTML=md(txt);
    LS.style.display='none';CV.style.display='block';
    window.scrollTo(0,0);PW.value='';
  }catch{
    EM.style.display='block';UB.disabled=false;UB.textContent='🔓 Открыть досье';PW.select();
  }
}
UB.onclick=unlock;
PW.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function lock(){CV.style.display='none';LS.style.display='flex';MO.innerHTML='';PW.value='';UB.textContent='🔓 Открыть досье'}
</script>
