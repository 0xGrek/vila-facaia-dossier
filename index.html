<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Защищённое досье</title>
<style>
:root{
  --bg:#0c0f1a;--surf:#131724;--card:#181d2e;--card2:#1d2236;
  --bdr:#252d45;--bdr2:#2e3755;
  --acc:#4f7ef8;--acc2:#7c5bfa;--teal:#0fb8a8;
  --text:#dde3f0;--muted:#7a88a8;--dim:#3d4d6a;
  --r:12px;--r-sm:8px;--sh-lg:0 6px 40px rgba(0,0,0,.6);
  --tr:all .2s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surf)}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 50% -10%,#1c2245,var(--bg));padding:20px}
.gbox{background:var(--surf);border:1px solid var(--bdr);border-radius:20px;
  padding:52px 44px;max-width:420px;width:100%;box-shadow:var(--sh-lg);text-align:center}
.gico{font-size:56px;display:block;margin-bottom:18px;filter:drop-shadow(0 4px 14px rgba(79,126,248,.35))}
.gbox h1{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;margin-bottom:8px;
  background:linear-gradient(135deg,#dde3f0,#7a88a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gbox p{color:var(--muted);font-size:.88rem;margin-bottom:28px}
.pwrap{position:relative;margin-bottom:12px}
#pw{width:100%;padding:13px 48px 13px 16px;background:var(--card);
  border:1.5px solid var(--bdr);border-radius:10px;font-size:.95rem;color:var(--text);
  outline:none;transition:var(--tr)}
#pw:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,126,248,.18)}
#pw::placeholder{color:var(--dim)}
#tglpw{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:4px}
#ubtn{width:100%;padding:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;
  letter-spacing:.02em;transition:var(--tr);box-shadow:0 4px 18px rgba(79,126,248,.35)}
#ubtn:hover{opacity:.9;transform:translateY(-1px)}
#ubtn:active{transform:scale(.98)}
#ubtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#errmsg{color:#f87171;font-size:.83rem;margin-top:10px;min-height:18px;display:none}
.gfoot{margin-top:20px;font-size:.73rem;color:var(--dim)}
.gfoot span{display:inline-block;background:rgba(79,126,248,.1);color:var(--acc);
  padding:2px 9px;border-radius:20px;border:1px solid rgba(79,126,248,.2);margin-top:6px}
#app{display:none}
.topbar{position:sticky;top:0;z-index:300;height:50px;
  background:rgba(12,15,26,.93);backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;padding:0 14px}
.tbrand{font-weight:800;font-size:.85rem;white-space:nowrap;
  display:flex;align-items:center;gap:6px;color:var(--text);flex-shrink:0}
.chip-nav{flex:1;overflow-x:auto;display:flex;align-items:center;gap:4px;
  padding:3px 0;scrollbar-width:none}
.chip-nav::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:.7rem;font-weight:600;color:var(--muted);
  background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:4px 10px;cursor:pointer;white-space:nowrap;transition:var(--tr);
  text-decoration:none;user-select:none}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.active{background:rgba(79,126,248,.18);border-color:var(--acc);color:#fff}
.chip[data-grp="plan"]{border-color:rgba(34,212,122,.35);color:#5eead4}
.chip[data-grp="plan"].active,.chip[data-grp="plan"]:hover{background:rgba(34,212,122,.15);border-color:#22d47a;color:#86efac}
.top-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.btn-sm{font-size:.7rem;font-weight:600;padding:4px 9px;border-radius:7px;
  cursor:pointer;transition:var(--tr);border:1px solid var(--bdr);
  background:var(--card);color:var(--muted);white-space:nowrap}
.btn-sm:hover{border-color:var(--acc);color:var(--acc)}
.btn-lock{background:rgba(240,0,85,.1);border-color:rgba(240,0,85,.25);color:#f87171}
.btn-lock:hover{background:rgba(240,0,85,.2)}
.layout{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.searchbar{position:relative;margin-bottom:14px}
.searchbar input{width:100%;padding:10px 16px 10px 38px;background:var(--surf);
  border:1.5px solid var(--bdr);border-radius:var(--r-sm);font-size:.86rem;
  color:var(--text);outline:none;transition:var(--tr)}
.searchbar input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,126,248,.12)}
.searchbar input::placeholder{color:var(--dim)}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--dim);pointer-events:none}
#search-clear{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;display:none;padding:2px}
.hero{background:linear-gradient(135deg,#141c35 0%,#1a2040 60%,#131d30 100%);
  border:1px solid var(--bdr2);border-radius:var(--r);padding:24px 22px 18px;
  margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle,rgba(79,126,248,.1),transparent 70%);pointer-events:none}
.hero-label{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.hero-title{font-size:1.55rem;font-weight:900;letter-spacing:-.04em;line-height:1.1;margin-bottom:3px;
  background:linear-gradient(135deg,#e8eeff 30%,#7a88a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{color:var(--muted);font-size:.8rem;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--bdr);
  border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat-ico{font-size:1rem;line-height:1}
.stat-val{font-size:1.15rem;font-weight:900;letter-spacing:-.03em;line-height:1.1;color:#fff}
.stat-lbl{font-size:.6rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.s-amber .stat-val{color:#fcd34d}.s-red .stat-val{color:#fca5a5}
.s-green .stat-val{color:#86efac}.s-teal .stat-val{color:#5eead4}
.s-prog{cursor:pointer}.s-prog .stat-val{color:#86efac}
.prog-mini{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:4px;overflow:hidden}
.prog-mini-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--teal),#22d47a);transition:width .4s ease}
.grp{border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:6px;
  overflow:hidden;scroll-margin-top:58px}
.grp.grp-plan{border-color:rgba(34,212,122,.28)}
.grp-hd{display:flex;align-items:center;gap:10px;padding:11px 16px;
  cursor:pointer;background:var(--surf);user-select:none;transition:background .15s}
.grp-hd:hover{background:var(--card)}
.grp.grp-plan .grp-hd{background:linear-gradient(90deg,rgba(34,212,122,.05),var(--surf))}
.grp.grp-plan .grp-title{color:#86efac}
.grp-ico{font-size:1.1rem;flex-shrink:0}
.grp-title{font-size:.9rem;font-weight:700;flex:1;color:var(--text)}
.grp-count{font-size:.67rem;font-weight:600;color:var(--dim);
  background:var(--card2);border:1px solid var(--bdr);
  padding:1px 7px;border-radius:10px;flex-shrink:0}
.grp-chev{font-size:.7rem;color:var(--dim);transition:transform .22s;flex-shrink:0}
.grp.open .grp-chev{transform:rotate(180deg)}
.grp-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease;border-top:0 solid var(--bdr)}
.grp.open .grp-body{grid-template-rows:1fr;border-top-width:1px}
.grp-body-inner{overflow:hidden}
.sec{border-bottom:1px solid var(--bdr)}
.sec:last-child{border-bottom:none}
.sec-hd{display:flex;align-items:flex-start;gap:9px;padding:9px 16px 9px 20px;
  cursor:pointer;background:var(--card);user-select:none;transition:background .15s}
.sec-hd:hover{background:var(--card2)}
.sec-num{flex-shrink:0;width:22px;height:22px;border-radius:5px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;font-size:.65rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.sec-num.sn-plan{background:linear-gradient(135deg,#22d47a,var(--teal))}
.sec-ico{font-size:.95rem;flex-shrink:0;margin-top:1px}
.sec-title{font-size:.85rem;font-weight:600;color:#b8c6e0;flex:1;line-height:1.3}
.sec-chev{font-size:.62rem;color:var(--dim);transition:transform .2s;flex-shrink:0;margin-top:3px}
.sec.open .sec-chev{transform:rotate(180deg)}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease;border-top:0 solid var(--bdr)}
.sec.open .sec-body{grid-template-rows:1fr;border-top-width:1px}
.sec-body-inner{overflow:hidden;padding:0}
.sec.open .sec-body-inner{padding:14px 16px 18px 20px}
.sec.search-hidden,.grp.search-hidden{display:none}
.md p{margin:0 0 10px;color:var(--text)}.md p:last-child{margin-bottom:0}
.md strong{color:#dde3f0;font-weight:700}
.md em{color:var(--muted);font-style:italic}
.md h3{font-size:.88rem;font-weight:700;color:var(--acc);margin:14px 0 6px}
.md h4{font-size:.82rem;font-weight:700;color:var(--teal);margin:11px 0 5px}
.md ul,.md ol{margin:4px 0 10px 18px}
.md li{margin-bottom:4px;color:var(--text)}
.md code{background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;
  font-family:'SF Mono',Consolas,monospace;font-size:.82em;color:#93c5fd}
.pill{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:20px;
  font-size:.73rem;font-weight:700;vertical-align:middle;white-space:nowrap}
.pr{background:rgba(240,0,85,.15);color:#ff80b5;border:1px solid rgba(240,0,85,.25)}
.pa{background:rgba(240,165,0,.15);color:#fcd34d;border:1px solid rgba(240,165,0,.25)}
.pg{background:rgba(34,212,122,.15);color:#86efac;border:1px solid rgba(34,212,122,.25)}
.md blockquote{border-left:3px solid var(--acc);background:rgba(79,126,248,.07);
  padding:9px 13px;border-radius:0 7px 7px 0;margin:7px 0 10px;
  color:var(--muted);font-style:italic;font-size:.86rem}
.twrap{overflow-x:auto;border:1px solid var(--bdr);border-radius:var(--r-sm);margin:7px 0 10px}
.twrap.gloss{max-height:480px;overflow-y:auto}
.md table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:340px}
.md thead th{background:linear-gradient(135deg,rgba(79,126,248,.18),rgba(124,91,250,.12));
  color:#94a3c0;padding:8px 11px;text-align:left;font-weight:700;font-size:.71rem;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--bdr)}
.md td{padding:8px 11px;border-bottom:1px solid rgba(37,45,69,.8);vertical-align:top;color:var(--text)}
.md tr:last-child td{border-bottom:none}
.md tr:nth-child(even) td{background:rgba(255,255,255,.018)}
.md tr:hover td{background:rgba(79,126,248,.05)}
.md td:first-child{font-weight:700;color:#93c5fd;white-space:nowrap}
tr.row-r td{background:rgba(240,0,85,.05)!important}
tr.row-a td{background:rgba(240,165,0,.04)!important}
tr.row-g td{background:rgba(34,212,122,.04)!important}
.cl-prog{margin-bottom:14px;background:var(--surf);border:1px solid var(--bdr);
  border-radius:var(--r-sm);padding:12px 14px}
.cl-prog-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cl-prog-title{font-size:.85rem;font-weight:700;color:var(--text)}
.cl-pct{font-size:.85rem;font-weight:800;color:#86efac}
.cl-bar-bg{height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;margin-bottom:8px}
.cl-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),#22d47a);transition:width .45s ease}
.cl-subgrps{display:flex;flex-wrap:wrap;gap:5px}
.cl-sg{font-size:.68rem;font-weight:600;color:var(--muted);
  background:var(--card2);border:1px solid var(--bdr);padding:2px 8px;border-radius:10px;white-space:nowrap}
.cl-sg.done{color:#86efac;border-color:rgba(34,212,122,.3);background:rgba(34,212,122,.07)}
.btn-reset{font-size:.72rem;font-weight:600;color:#f87171;
  background:rgba(240,0,85,.08);border:1px solid rgba(240,0,85,.2);
  border-radius:7px;padding:4px 11px;cursor:pointer;transition:var(--tr);margin-top:8px}
.btn-reset:hover{background:rgba(240,0,85,.18)}
.cl-group{margin:12px 0 4px}
.cl-gh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:6px}
.cl-gl{font-size:.8rem;font-weight:700;color:var(--acc);flex:1}
.cl-gbadge{font-size:.67rem;font-weight:600;color:var(--muted);
  background:var(--card2);border:1px solid var(--bdr);
  padding:1px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.cl-item{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;
  border-radius:7px;cursor:pointer;transition:background .13s;margin-bottom:2px;
  border:1px solid transparent}
.cl-item:hover{background:rgba(79,126,248,.07);border-color:rgba(79,126,248,.15)}
.cl-item.done{background:rgba(34,212,122,.04)}
.cl-item.done:hover{background:rgba(34,212,122,.09)}
.cl-cb{flex-shrink:0;width:17px;height:17px;border-radius:4px;margin-top:2px;
  border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;
  transition:var(--tr);background:transparent}
.cl-item.done .cl-cb{background:#22d47a;border-color:#22d47a}
.cl-tick{display:none;color:#000;font-size:10px;font-weight:900;line-height:1}
.cl-item.done .cl-tick{display:block}
.cl-text{font-size:.84rem;color:var(--text);line-height:1.4;flex:1;transition:color .2s}
.cl-item.done .cl-text{color:var(--dim);text-decoration:line-through}
.msg-card{background:var(--card2);border:1px solid var(--bdr);border-radius:var(--r-sm);margin-bottom:12px;overflow:hidden}
.msg-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bdr)}
.msg-title{font-size:.82rem;font-weight:700;color:var(--teal)}
.msg-copy{font-size:.72rem;font-weight:600;color:var(--acc);
  background:rgba(79,126,248,.1);border:1px solid rgba(79,126,248,.25);
  border-radius:6px;padding:3px 10px;cursor:pointer;transition:var(--tr);user-select:none;white-space:nowrap;flex-shrink:0}
.msg-copy:hover{background:rgba(79,126,248,.22)}
.msg-copy.copied{color:#86efac;border-color:rgba(34,212,122,.4);background:rgba(34,212,122,.1)}
.msg-body{padding:12px 14px;font-size:.83rem;color:var(--muted);white-space:pre-wrap;line-height:1.6}
.gloss-search{width:100%;padding:8px 12px;background:var(--card2);
  border:1px solid var(--bdr);border-radius:var(--r-sm);font-size:.84rem;
  color:var(--text);outline:none;margin-bottom:9px;transition:var(--tr)}
.gloss-search:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(79,126,248,.15)}
.gloss-search::placeholder{color:var(--dim)}
.gloss-hidden{display:none}
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-top:4px}
.c-card{background:var(--card2);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:11px 13px}
.c-name{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.c-val{font-size:.88rem;color:var(--text);font-weight:600}
.no-results{text-align:center;padding:36px 20px;color:var(--muted);font-size:.88rem}
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero-title{font-size:1.3rem}.gbox{padding:34px 20px}
  .layout{padding:12px 9px 60px}
  .topbar{padding:0 9px}.tbrand span{display:none}
  .top-actions .btn-sm:not(.btn-lock){display:none}
  .twrap.gloss{max-height:340px}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <span class="gico">🏠</span>
    <h1>Закрытое досье</h1>
    <p>Конфиденциальный документ. Введите пароль для доступа.</p>
    <div class="pwrap">
      <input type="password" id="pw" placeholder="Пароль…"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="tglpw" type="button" aria-label="Показать">👁</button>
    </div>
    <button id="ubtn" type="button">🔓 Открыть досье</button>
    <div id="errmsg">Неверный пароль. Попробуйте ещё раз.</div>
    <div class="gfoot"><span>🔒 AES-256-GCM · PBKDF2-250k · client-side</span></div>
  </div>
</div>

<div id="app">
  <nav class="topbar">
    <div class="tbrand">🏠 <span id="brand-lbl">Досье</span></div>
    <div class="chip-nav" id="chip-nav"></div>
    <div class="top-actions">
      <button class="btn-sm" onclick="expandAll()">▼ Все</button>
      <button class="btn-sm" onclick="collapseAll()">▲ Свернуть</button>
      <button class="btn-sm btn-lock" onclick="lockApp()">🔒 Выйти</button>
    </div>
  </nav>
  <div class="layout">
    <div class="hero" id="hero"></div>
    <div class="searchbar">
      <span class="search-ico">🔍</span>
      <input type="text" id="search" placeholder="Поиск по разделам…" autocomplete="off">
      <button id="search-clear" onclick="clearSearch()">✕</button>
    </div>
    <div id="accordion"></div>
    <div class="no-results" id="no-results" style="display:none">Ничего не найдено</div>
  </div>

function b2u(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function doDecrypt(pw){
  const e=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b2u(PL.salt),iterations:250000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']
  );
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(PL.iv)},k,b2u(PL.ct)));
}

function ckKey(t){let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return'vf-check-'+h.toString(36)}
function ckGet(t){try{return localStorage.getItem(ckKey(t))==='1'}catch{return false}}
function ckSet(t,v){try{localStorage.setItem(ckKey(t),v?'1':'0')}catch{}}
function ckClear(){try{Object.keys(localStorage).filter(k=>k.startsWith('vf-check-')).forEach(k=>localStorage.removeItem(k))}catch{}}

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inl(r){
  return esc(r)
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(?<![*])\*(?![*])(.+?)(?<![*])\*(?![*])/g,'<em>$1</em>')
    .replace(/[`]([^`]+)[`]/g,'<code>$1</code>');
}
function pil(s){
  return s
    .replace(/🔴\s+([^\n<]{1,60})/g,'<span class="pill pr">🔴 $1</span>')
    .replace(/🟡\s+([^\n<]{1,60})/g,'<span class="pill pa">🟡 $1</span>')
    .replace(/🟢\s+([^\n<]{1,60})/g,'<span class="pill pg">🟢 $1</span>')
    .replace(/✅\s+([^\n<]{1,60})/g,'<span class="pill pg">✅ $1</span>')
    .replace(/❌\s+([^\n<]{1,60})/g,'<span class="pill pr">❌ $1</span>')
    .replace(/⚠️\s+([^\n<]{1,60})/g,'<span class="pill pa">⚠️ $1</span>')
    .replace(/🔴(?=[\s<]|$)/g,'<span class="pill pr">🔴</span>')
    .replace(/🟡(?=[\s<]|$)/g,'<span class="pill pa">🟡</span>')
    .replace(/🟢(?=[\s<]|$)/g,'<span class="pill pg">🟢</span>')
    .replace(/✅(?=[\s<]|$)/g,'<span class="pill pg">✅</span>')
    .replace(/❌(?=[\s<]|$)/g,'<span class="pill pr">❌</span>');
}

function parseBody(raw){
  const lines=raw.split('\n');
  let out='',tbl=false,th=true,ul=false,ol=false;
  const cul=()=>{if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}};
  const ctbl=()=>{if(tbl){out+='</tbody></table></div>';tbl=false;th=true}};
  function rt(c){const j=c.join(' ');return/🔴/.test(j)?' class="row-r"':/🟡/.test(j)?' class="row-a"':/🟢/.test(j)?' class="row-g"':'';}
  for(const line of lines){
    const lt=line.trim();
    if(!lt){cul();if(!tbl)out+='';continue}
    if(/^---+$/.test(lt)){cul();ctbl();continue}
    const hm=line.match(/^(#{3,4})\s+(.+)/);
    if(hm){cul();ctbl();const lv=hm[1].length;out+=`<h${lv}>${pil(inl(hm[2]))}</h${lv}>`;continue}
    if(/^>/.test(line)){cul();ctbl();out+='<blockquote>'+pil(inl(lt.replace(/^>+\s*/,'')))+'</blockquote>';continue}
    if(lt.startsWith('|')&&lt.endsWith('|')){
      const cells=lt.split('|').slice(1,-1);
      if(cells.every(c=>/^[-: ]+$/.test(c))){if(tbl&&th){out+='</thead><tbody>';th=false}continue}
      if(!tbl){cul();out+='<div class="twrap"><table><thead>';tbl=true;th=true}
      const tag=th?'th':'td';
      out+=`<tr${th?'':rt(cells)}>${cells.map(c=>'<'+tag+'>'+pil(inl(c.trim()))+'</'+tag+'>').join('')}</tr>`;
      continue;
    } else ctbl();
    const um=line.match(/^\s*[-*+]\s(.+)/);
    if(um){
      if(!ul){if(ol){out+='</ol>';ol=false}out+='<ul>';ul=true}
      const cb=um[1].match(/^\[([xX ])\]\s+(.+)/);
      if(cb){const chk=cb[1].toLowerCase()==='x'?' checked':'';out+=`<li><input type="checkbox"${chk} disabled> ${pil(inl(cb[2]))}</li>`;}
      else out+=`<li>${pil(inl(um[1]))}</li>`;
      continue;
    }
    const om=line.match(/^\s*\d+\.\s+(.+)/);
    if(om){if(!ol){if(ul){out+='</ul>';ul=false}out+='<ol>';ol=true}out+=`<li>${pil(inl(om[1]))}</li>`;continue}
    cul();out+=`<p>${pil(inl(lt))}</p>`;
  }
  cul();ctbl();
  return out;
}

function buildCL(raw){
  const lines=raw.split('\n');
  let groups=[],cur=null,pend='';
  const fp=()=>{const r=pend.trim()?parseBody(pend):'';pend='';return r};
  let pre='';
  for(const line of lines){
    const hm=line.match(/^###\s+(.+)/);
    if(hm){pre+=fp();if(cur)groups.push(cur);cur={label:hm[1].trim(),items:[]};continue}
    const cbm=line.match(/^\s*-\s+\[([xX ])\]\s+(.+)/);
    if(cbm){pre+=fp();if(!cur)cur={label:'',items:[]};cur.items.push({text:cbm[2].trim(),checked:cbm[1].toLowerCase()==='x'});continue}
    if(line.trim())pend+=line+'\n';else pend+='\n';
  }
  if(cur)groups.push(cur);
  pre+=fp();
  const total=groups.reduce((s,g)=>s+g.items.length,0);
  let html='<div class="cl-prog">'+
    '<div class="cl-prog-hd"><span class="cl-prog-title">Прогресс чеклиста</span>'+
    '<span class="cl-pct" id="cl-pct">0 / '+total+' (0%)</span></div>'+
    '<div class="cl-bar-bg"><div class="cl-bar-fill" id="cl-bar" style="width:0%"></div></div>'+
    '<div class="cl-subgrps" id="cl-sgs"></div>'+
    '<button class="btn-reset" onclick="resetCL()">↺ Сбросить прогресс</button>'+
    '</div>'+pre;
  for(const g of groups){
    if(!g.items.length)continue;
    const gid='clg'+Math.random().toString(36).slice(2,6);
    html+='<div class="cl-group" data-gid="'+gid+'">'+
      '<div class="cl-gh"><span class="cl-gl">'+pil(inl(g.label))+'</span>'+
      '<span class="cl-gbadge" id="b-'+gid+'">0/'+g.items.length+'</span></div>';
    for(const item of g.items){
      const k=ckKey(item.text);
      html+='<div class="cl-item" id="ci-'+k+'" data-ck="'+k+'" data-txt="'+esc(item.text)+'" onclick="toggleCK(this)">'+
        '<div class="cl-cb"><span class="cl-tick">✓</span></div>'+
        '<span class="cl-text">'+pil(inl(item.text))+'</span></div>';
    }
    html+='</div>';
  }
  return{html,total,groups};
}

window.toggleCK=function(el){
  const done=!el.classList.contains('done');
  ckSet(el.dataset.txt,done);el.classList.toggle('done',done);refreshProg();
};
window.resetCL=function(){
  if(!confirm('Сбросить весь прогресс?'))return;
  ckClear();document.querySelectorAll('.cl-item.done').forEach(el=>el.classList.remove('done'));refreshProg();
};
function refreshProg(){
  const items=document.querySelectorAll('.cl-item');if(!items.length)return;
  const total=items.length,done=[...items].filter(e=>e.classList.contains('done')).length;
  const pct=Math.round(done/total*100);
  const bar=document.getElementById('cl-bar'),txt=document.getElementById('cl-pct');
  if(bar)bar.style.width=pct+'%';
  if(txt)txt.textContent=done+' / '+total+' ('+pct+'%)';
  document.querySelectorAll('[data-gid]').forEach(g=>{
    const gid=g.dataset.gid,gi=g.querySelectorAll('.cl-item');
    const gd=[...gi].filter(e=>e.classList.contains('done')).length;
    const b=document.getElementById('b-'+gid);
    if(b){b.textContent=gd+'/'+gi.length;b.style.color=gd===gi.length?'#86efac':'';}
  });
  document.querySelectorAll('#cl-sgs .cl-sg').forEach(sg=>{
    const gi=document.querySelectorAll('[data-gid="'+sg.dataset.gid+'"] .cl-item');
    if(!gi.length)return;
    const gd=[...gi].filter(e=>e.classList.contains('done')).length;
    sg.textContent=sg.dataset.lbl+' '+gd+'/'+gi.length;
    sg.classList.toggle('done',gd===gi.length);
  });
  const hv=document.getElementById('hero-prog-val'),hb=document.getElementById('hero-prog-bar');
  if(hv)hv.textContent=pct+'%';if(hb)hb.style.width=pct+'%';
}
function initCL(){
  document.querySelectorAll('.cl-item').forEach(el=>el.classList.toggle('done',ckGet(el.dataset.txt)));
  refreshProg();
}

function buildMsgs(raw){
  const lines=raw.split('\n');
  let msgs=[],cur=null;
  for(const line of lines){
    const hm=line.match(/^###\s+(.+)/);
    if(hm){if(cur)msgs.push(cur);cur={title:hm[1].trim(),lines:[]};continue}
    if(!cur)continue;
    if(/^>/.test(line))cur.lines.push(line.replace(/^>\s?/,''));
  }
  if(cur)msgs.push(cur);
  let html='';
  for(const m of msgs){
    if(!m.lines.length)continue;
    const body=m.lines.join('\n').trim();
    const safe=body.replace(/'/g,"\\'").replace(/\n/g,'\\n');
    const cid='mc'+Math.random().toString(36).slice(2,6);
    html+='<div class="msg-card">'+
      '<div class="msg-head"><span class="msg-title">'+pil(inl(m.title))+'</span>'+
      '<button class="msg-copy" id="cp-'+cid+'" onclick="cpMsg(''+safe+'','cp-'+cid+'')">📋 Копировать</button></div>'+
      '<div class="msg-body">'+esc(body).replace(/\n/g,'<br>')+'</div></div>';
  }
  return html||parseBody(raw);
}
window.cpMsg=function(text,btnId){
  navigator.clipboard.writeText(text.replace(/\\n/g,'\n')).then(()=>{
    const btn=document.getElementById(btnId);if(!btn)return;
    btn.textContent='✓ Скопировано';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 Копировать';btn.classList.remove('copied');},2200);
  }).catch(()=>{});
};

function buildGloss(raw){
  const base=parseBody(raw);
  const fid='gf'+Math.random().toString(36).slice(2,6);
  return `<input class="gloss-search" id="${fid}" placeholder="🔍 Фильтр терминов…" oninput="fGl('${fid}')">`
    +base.replace('<div class="twrap">','<div class="twrap gloss" id="tw'+fid+'">');
}
window.fGl=function(id){
  const q=document.getElementById(id).value.toLowerCase();
  const w=document.getElementById('tw'+id);if(!w)return;
  w.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('gloss-hidden',q&&!tr.textContent.toLowerCase().includes(q)));
};

function buildContacts(raw){
  const rows=[];
  for(const line of raw.split('\n')){
    const lt=line.trim();if(!lt.startsWith('|'))continue;
    const cells=lt.split('|').slice(1,-1).map(c=>c.trim());
    if(cells.length<2||cells.every(c=>/^[-: ]+$/.test(c))||/^Кто/i.test(cells[0]))continue;
    rows.push(cells);
  }
  let h='<div class="contacts-grid">';
  for(const r of rows)h+=`<div class="c-card"><div class="c-name">${esc(r[0])}</div><div class="c-val">${esc(r[1]||'')}</div></div>`;
  return h+'</div>';
}

function parseMD(src){
  const chunks=src.replace(/\r\n/g,'\n').split(/^(?=## )/m);
  const pre=chunks[0];
  const sections=[];
  let clTotal=0,clGroups=[];
  for(const chunk of chunks.slice(1)){
    const nl=chunk.indexOf('\n');
    const heading=(nl>=0?chunk.slice(0,nl):chunk).trim();
    const body=nl>=0?chunk.slice(nl+1):'';
    const hm=heading.match(/^##\s+(\d+[a-z]?)?\.?\s*(.*)$/i);if(!hm)continue;
    const num=(hm[1]||'').trim();
    const rest=hm[2].trim();
    const emRe=/^([🀀-🫿☀-➿︀-﻿‍✅❌⚠️🔴🟡🟢🎯🔑🚨🏗🧠🗺🏘💳🗓⚖👥🛒🧾💬⏰📋🌍👤🚀📖📑📨]+)/u;
    const emM=rest.match(emRe);
    const emoji=emM?emM[1]:'📌';
    const title=rest.replace(emRe,'').trim()||rest;
    const isContacts=rest.toUpperCase().includes('КОНТАКТ');
    const isCl=(num==='33'),isMsgs=(num==='34'),isGloss=(num==='30');
    let bodyHtml='';
    if(isContacts)bodyHtml=buildContacts(body);
    else if(isGloss)bodyHtml=buildGloss(body);
    else if(isCl){const r=buildCL(body);bodyHtml=r.html;clTotal=r.total;clGroups=r.groups;}
    else if(isMsgs)bodyHtml=buildMsgs(body);
    else bodyHtml=parseBody(body);
    sections.push({num,emoji,title,bodyHtml,isContacts,isCl,isMsgs});
  }
  const h1m=pre.match(/^#\s+(.+)$/m);
  const h1=h1m?h1m[1].replace(/[#*]/g,'').replace(/[`]/g,'').trim():'Досье';
  const bqm=pre.match(/^>\s*(.+)$/m);
  const sub=bqm?bqm[1]:'';
  const prm=src.match(/Цена в объявлении[^*]*\*\*([^*]+)\*\*/);
  const priceStr=prm?prm[1].trim():'—';
  return{h1,sub,priceStr,sections,clTotal,clGroups};
}

const GROUPS=[
  {id:'plan', ico:'✅', label:'План и чеклист', nums:['33'],       plan:true},
  {id:'dom',  ico:'🏠', label:'Дом и цена',     nums:['1','2','19','16','11','9']},
  {id:'money',ico:'💰', label:'Деньги и налоги', nums:['7','7b','8','17','15']},
  {id:'docs', ico:'📂', label:'Документы',        nums:['27','13','20','21']},
  {id:'move', ico:'🛒', label:'Заезд и затраты',  nums:['24','3','4','5','6','23']},
  {id:'biz',  ico:'🏗', label:'Бизнес',           nums:['29','26','12','14']},
  {id:'deal', ico:'📜', label:'Договор и риски',  nums:['34','32','31','28','25','10','18','22']},
  {id:'gloss',ico:'📖', label:'Глоссарий',         nums:['30']},
  {id:'cont', ico:'📇', label:'Контакты',          nums:['CONTACTS']},
];

function buildApp(md){
  const{h1,sub,priceStr,sections,clTotal,clGroups}=parseMD(md);
  const short=h1.replace(/🏠\s*/,'').split('—')[0].trim();
  document.getElementById('brand-lbl').textContent=short;

  document.getElementById('hero').innerHTML=`
    <div class="hero-label">🇵🇹 Центральная Португалия · Leiria</div>
    <div class="hero-title">${esc(h1)}</div>
    <div class="hero-sub">${esc(sub.slice(0,90))}</div>
    <div class="stats">
      <div class="stat s-amber"><div class="stat-ico">💰</div>
        <div class="stat-val">${esc(priceStr)}</div><div class="stat-lbl">Цена объявл.</div></div>
      <div class="stat s-green"><div class="stat-ico">🎯</div>
        <div class="stat-val">€265k</div><div class="stat-lbl">Цель торга</div></div>
      <div class="stat s-green"><div class="stat-ico">🏷️</div>
        <div class="stat-val">€0 IMT</div><div class="stat-lbl">IMT Jovem</div></div>
      <div class="stat s-red"><div class="stat-ico">🏦</div>
        <div class="stat-val">€85-115k</div><div class="stat-lbl">Нужно нала</div></div>
      <div class="stat s-red"><div class="stat-ico">🛒</div>
        <div class="stat-val">€28-38k</div><div class="stat-lbl">Заезд (пустой!)</div></div>
      <div class="stat s-prog" onclick="goToPlan()">
        <div class="stat-ico">✅</div>
        <div class="stat-val" id="hero-prog-val">0%</div>
        <div class="stat-lbl">Чеклист</div>
        <div class="prog-mini"><div class="prog-mini-fill" id="hero-prog-bar" style="width:0%"></div></div>
      </div>
    </div>`;

  const byNum={};
  for(const s of sections){byNum[s.num||'CONTACTS']=s;if(s.isContacts)byNum['CONTACTS']=s;}

  const chipNav=document.getElementById('chip-nav');
  chipNav.innerHTML='';
  for(const g of GROUPS){
    const a=document.createElement('a');
    a.className='chip';a.href='#grp-'+g.id;
    a.textContent=g.ico+' '+g.label;a.dataset.grp=g.id;
    a.addEventListener('click',e=>{
      e.preventDefault();
      const el=document.getElementById('grp-'+g.id);if(!el)return;
      el.scrollIntoView({behavior:'smooth',block:'start'});
      if(!el.classList.contains('open'))toggleGrp(el);
    });
    chipNav.appendChild(a);
  }

  const acc=document.getElementById('accordion');
  acc.innerHTML='';
  for(const g of GROUPS){
    const secs=g.nums.map(n=>byNum[n]).filter(Boolean);
    const grpEl=document.createElement('div');
    grpEl.className='grp'+(g.plan?' grp-plan':'');
    grpEl.id='grp-'+g.id;
    const hd=document.createElement('div');hd.className='grp-hd';
    hd.innerHTML=`<span class="grp-ico">${g.ico}</span>
      <span class="grp-title">${esc(g.label)}</span>
      <span class="grp-count">${secs.length} разд.</span>
      <span class="grp-chev">▼</span>`;
    hd.addEventListener('click',()=>toggleGrp(grpEl));
    grpEl.appendChild(hd);
    const body=document.createElement('div');body.className='grp-body';
    const inner=document.createElement('div');inner.className='grp-body-inner';
    for(const s of secs){
      const secEl=document.createElement('div');
      secEl.className='sec';
      secEl.dataset.title=(s.title+' '+s.num).toLowerCase();
      const sHd=document.createElement('div');sHd.className='sec-hd';
      const nb=s.num?
        `<div class="sec-num${g.plan?' sn-plan':''}">${esc(s.num)}</div>`:
        `<div class="sec-num" style="font-size:.85rem">📇</div>`;
      sHd.innerHTML=nb+`<span class="sec-ico">${s.emoji}</span>
        <span class="sec-title">${esc(s.title)}</span>
        <span class="sec-chev">▼</span>`;
      sHd.addEventListener('click',()=>toggleSec(secEl));
      secEl.appendChild(sHd);
      const sBd=document.createElement('div');sBd.className='sec-body';
      const sBdI=document.createElement('div');sBdI.className='sec-body-inner md';
      sBdI.innerHTML=s.bodyHtml;sBd.appendChild(sBdI);
      secEl.appendChild(sBd);inner.appendChild(secEl);
    }
    body.appendChild(inner);grpEl.appendChild(body);acc.appendChild(grpEl);
  }

  /* sub-group pills */
  const sgWrap=document.getElementById('cl-sgs');
  if(sgWrap){
    document.querySelectorAll('[data-gid]').forEach(gd=>{
      const gid=gd.dataset.gid;
      const items=gd.querySelectorAll('.cl-item');if(!items.length)return;
      const le=gd.querySelector('.cl-gl');
      const lbl=le?le.textContent.replace(/[^\w\sА-Яа-яЁё]/gu,'').trim().slice(0,14):'—';
      const p=document.createElement('span');
      p.className='cl-sg';p.dataset.gid=gid;p.dataset.lbl=lbl;
      p.textContent=lbl+' 0/'+items.length;
      sgWrap.appendChild(p);
    });
  }

  initCL();

  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id=e.target.id.replace('grp-','');
        document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.grp===id));
      }
    });
  },{rootMargin:'-52px 0px -55% 0px',threshold:0});
  document.querySelectorAll('.grp').forEach(g=>obs.observe(g));

  const si=document.getElementById('search'),sc=document.getElementById('search-clear');
  si.addEventListener('input',()=>{const q=si.value.trim().toLowerCase();sc.style.display=q?'block':'none';doSearch(q);});
  function doSearch(q){
    let any=false;
    document.querySelectorAll('.grp').forEach(g=>{
      let m=false;
      g.querySelectorAll('.sec').forEach(s=>{
        const hit=!q||s.dataset.title.includes(q)||(s.querySelector('.sec-body-inner')?.textContent||'').toLowerCase().includes(q);
        s.classList.toggle('search-hidden',!hit);if(hit)m=true;
      });
      g.classList.toggle('search-hidden',!m);
      if(m){any=true;if(q&&!g.classList.contains('open'))toggleGrp(g);}
    });
    document.getElementById('no-results').style.display=any?'none':'block';
  }
}

window.goToPlan=function(){
  const el=document.getElementById('grp-plan');if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  if(!el.classList.contains('open'))toggleGrp(el);
  const sec=el.querySelector('.sec');
  if(sec&&!sec.classList.contains('open'))toggleSec(sec);
};

function toggleGrp(el){el.classList.toggle('open')}
function toggleSec(el){el.classList.toggle('open')}
function expandAll(){
  document.querySelectorAll('.grp:not(.search-hidden)').forEach(g=>{
    g.classList.add('open');
    g.querySelectorAll('.sec:not(.search-hidden)').forEach(s=>s.classList.add('open'));
  });
}
function collapseAll(){document.querySelectorAll('.grp,.sec').forEach(e=>e.classList.remove('open'))}
function clearSearch(){
  document.getElementById('search').value='';
  document.getElementById('search-clear').style.display='none';
  document.querySelectorAll('.search-hidden').forEach(e=>e.classList.remove('search-hidden'));
  document.getElementById('no-results').style.display='none';
}

const gEl=document.getElementById('gate'),aEl=document.getElementById('app');
const pEl=document.getElementById('pw'),bEl=document.getElementById('ubtn');
const eEl=document.getElementById('errmsg'),tEl=document.getElementById('tglpw');
tEl.onclick=()=>{pEl.type=pEl.type==='password'?'text':'password';tEl.textContent=pEl.type==='password'?'👁':'🙈'};
async function unlock(){
  const pw=pEl.value.trim();if(!pw)return;
  bEl.disabled=true;bEl.textContent='⏳ Расшифровка…';eEl.style.display='none';
  try{
    const txt=await doDecrypt(pw);
    buildApp(txt);
    gEl.style.display='none';aEl.style.display='block';window.scrollTo(0,0);pEl.value='';
  }catch{
    eEl.style.display='block';bEl.disabled=false;bEl.textContent='🔓 Открыть досье';pEl.select();
  }
}
bEl.onclick=unlock;
pEl.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function lockApp(){
  aEl.style.display='none';gEl.style.display='flex';
  ['accordion','hero','chip-nav'].forEach(id=>document.getElementById(id).innerHTML='');
  document.getElementById('search').value='';
  pEl.value='';bEl.disabled=false;bEl.textContent='🔓 Открыть досье';
}
