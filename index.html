<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Защищённое досье</title>
<style>
:root{
  --bg:#0c0f1a;--surf:#131724;--card:#181d2e;--card2:#1d2236;
  --bdr:#252d45;--bdr2:#2e3755;
  --acc:#4f7ef8;--acc2:#7c5bfa;--teal:#0fb8a8;
  --text:#dde3f0;--muted:#7a88a8;--dim:#3d4d6a;
  --r:14px;--r-sm:8px;--sh-lg:0 6px 40px rgba(0,0,0,.6);
  --tr:all .22s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;
  line-height:1.65;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surf)}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 50% -10%,#1c2245,var(--bg));padding:20px}
.gbox{background:var(--surf);border:1px solid var(--bdr);border-radius:20px;
  padding:52px 44px;max-width:420px;width:100%;box-shadow:var(--sh-lg);text-align:center}
.gico{font-size:56px;display:block;margin-bottom:18px;
  filter:drop-shadow(0 4px 14px rgba(79,126,248,.35))}
.gbox h1{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;margin-bottom:8px;
  background:linear-gradient(135deg,#dde3f0,#7a88a8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gbox p{color:var(--muted);font-size:.88rem;margin-bottom:30px}
.pwrap{position:relative;margin-bottom:12px}
#pw{width:100%;padding:13px 48px 13px 16px;background:var(--card);
  border:1.5px solid var(--bdr);border-radius:10px;font-size:.95rem;
  color:var(--text);outline:none;transition:var(--tr)}
#pw:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,126,248,.18)}
#pw::placeholder{color:var(--dim)}
#tglpw{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:4px}
#ubtn{width:100%;padding:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;
  letter-spacing:.02em;transition:var(--tr);box-shadow:0 4px 18px rgba(79,126,248,.35)}
#ubtn:hover{opacity:.9;transform:translateY(-1px)}
#ubtn:active{transform:scale(.98)}
#ubtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#errmsg{color:#f87171;font-size:.83rem;margin-top:10px;min-height:18px;display:none}
.gfoot{margin-top:22px;font-size:.73rem;color:var(--dim)}
.gfoot span{display:inline-block;background:rgba(79,126,248,.1);color:var(--acc);
  padding:2px 9px;border-radius:20px;border:1px solid rgba(79,126,248,.2);margin-top:6px}
#app{display:none}
.topbar{position:sticky;top:0;z-index:300;height:52px;
  background:rgba(12,15,26,.92);backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;padding:0 16px}
.tbrand{font-weight:800;font-size:.88rem;white-space:nowrap;
  display:flex;align-items:center;gap:7px;color:var(--text);flex-shrink:0}
.chip-nav{flex:1;overflow-x:auto;display:flex;align-items:center;gap:5px;
  padding:4px 0;scrollbar-width:none}
.chip-nav::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:.72rem;font-weight:600;color:var(--muted);
  background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:5px 11px;cursor:pointer;white-space:nowrap;transition:var(--tr);
  text-decoration:none;user-select:none}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.active{background:rgba(79,126,248,.18);border-color:var(--acc);color:#fff}
.top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-sm{font-size:.72rem;font-weight:600;padding:5px 10px;border-radius:8px;
  cursor:pointer;transition:var(--tr);border:1px solid var(--bdr);
  background:var(--card);color:var(--muted);white-space:nowrap}
.btn-sm:hover{border-color:var(--acc);color:var(--acc)}
.btn-lock{background:rgba(240,0,85,.1);border-color:rgba(240,0,85,.25);color:#f87171}
.btn-lock:hover{background:rgba(240,0,85,.2);border-color:rgba(240,0,85,.4);color:#fca5a5}
.layout{max-width:920px;margin:0 auto;padding:22px 14px 80px}
.searchbar{position:relative;margin-bottom:18px}
.searchbar input{width:100%;padding:11px 16px 11px 40px;background:var(--surf);
  border:1.5px solid var(--bdr);border-radius:var(--r-sm);font-size:.88rem;
  color:var(--text);outline:none;transition:var(--tr)}
.searchbar input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,126,248,.12)}
.searchbar input::placeholder{color:var(--dim)}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:15px;color:var(--dim);pointer-events:none}
#search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;display:none;padding:2px}
.hero{background:linear-gradient(135deg,#141c35 0%,#1a2040 60%,#131d30 100%);
  border:1px solid var(--bdr2);border-radius:var(--r);padding:28px 24px 22px;
  margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;
  border-radius:50%;background:radial-gradient(circle,rgba(79,126,248,.1),transparent 70%);pointer-events:none}
.hero-label{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.hero-title{font-size:1.7rem;font-weight:900;letter-spacing:-.04em;line-height:1.1;margin-bottom:4px;
  background:linear-gradient(135deg,#e8eeff 30%,#7a88a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.035);border:1px solid var(--bdr);
  border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.stat-ico{font-size:1.1rem;line-height:1}
.stat-val{font-size:1.25rem;font-weight:900;letter-spacing:-.03em;line-height:1;color:#fff}
.stat-lbl{font-size:.64rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.s-amber .stat-val{color:#fcd34d}.s-red .stat-val{color:#fca5a5}
.s-green .stat-val{color:#86efac}.s-teal .stat-val{color:#5eead4}
.grp{border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:10px;
  overflow:hidden;scroll-margin-top:60px;transition:border-color .2s}
.grp:hover{border-color:var(--bdr2)}
.grp-hd{display:flex;align-items:center;gap:12px;padding:15px 18px;
  cursor:pointer;background:var(--surf);user-select:none;transition:var(--tr)}
.grp-hd:hover{background:var(--card)}
.grp-ico{font-size:1.2rem;flex-shrink:0}
.grp-title{font-size:.98rem;font-weight:700;letter-spacing:-.01em;flex:1;color:var(--text)}
.grp-count{font-size:.7rem;font-weight:600;color:var(--muted);background:var(--card2);
  border:1px solid var(--bdr);padding:2px 8px;border-radius:12px;flex-shrink:0}
.grp-chev{font-size:.75rem;color:var(--muted);transition:transform .25s;flex-shrink:0}
.grp.open .grp-chev{transform:rotate(180deg)}
.grp-body{display:none;border-top:1px solid var(--bdr)}
.grp.open .grp-body{display:block}
.sec{border-bottom:1px solid var(--bdr)}
.sec:last-child{border-bottom:none}
.sec-hd{display:flex;align-items:flex-start;gap:10px;padding:12px 18px 12px 24px;
  cursor:pointer;background:var(--card);user-select:none;transition:var(--tr)}
.sec-hd:hover{background:var(--card2)}
.sec-num{flex-shrink:0;width:24px;height:24px;border-radius:6px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;font-size:.68rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.sec-ico{font-size:1rem;flex-shrink:0;margin-top:1px}
.sec-title{font-size:.88rem;font-weight:600;color:#b8c6e0;flex:1;line-height:1.3}
.sec-chev{font-size:.65rem;color:var(--dim);transition:transform .22s;flex-shrink:0;margin-top:3px}
.sec.open .sec-chev{transform:rotate(180deg)}
.sec-body{display:none;padding:16px 18px 20px 24px;border-top:1px solid var(--bdr);
  background:var(--bg);animation:fadeIn .18s ease}
.sec.open .sec-body{display:block}
.sec.search-hidden,.grp.search-hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.md p{margin:0 0 11px;color:var(--text)}.md p:last-child{margin-bottom:0}
.md strong{color:#dde3f0;font-weight:700}
.md em{color:var(--muted);font-style:italic}
.md h3{font-size:.9rem;font-weight:700;color:var(--acc);margin:16px 0 7px}
.md h4{font-size:.83rem;font-weight:700;color:var(--teal);margin:12px 0 5px}
.md ul,.md ol{margin:5px 0 11px 20px}
.md li{margin-bottom:4px;color:var(--text)}
.md li input[type=checkbox]{accent-color:var(--acc);margin-right:7px;width:14px;height:14px;vertical-align:middle}
.md blockquote{border-left:3px solid var(--acc);background:rgba(79,126,248,.07);
  padding:10px 14px;border-radius:0 7px 7px 0;margin:8px 0 11px;
  color:var(--muted);font-style:italic;font-size:.88rem}
.md code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:4px;
  font-family:'SF Mono',Consolas,monospace;font-size:.82em;color:#93c5fd}
.pill{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:20px;
  font-size:.75rem;font-weight:700;vertical-align:middle;white-space:nowrap}
.pr{background:rgba(240,0,85,.15);color:#ff80b5;border:1px solid rgba(240,0,85,.25)}
.pa{background:rgba(240,165,0,.15);color:#fcd34d;border:1px solid rgba(240,165,0,.25)}
.pg{background:rgba(34,212,122,.15);color:#86efac;border:1px solid rgba(34,212,122,.25)}
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--bdr);border-radius:var(--r-sm);margin:8px 0 12px}
.md table{width:100%;border-collapse:collapse;font-size:.83rem;min-width:360px}
.md thead th{background:linear-gradient(135deg,rgba(79,126,248,.18),rgba(124,91,250,.12));
  color:#94a3c0;padding:9px 12px;text-align:left;font-weight:700;font-size:.73rem;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:1}
.md td{padding:9px 12px;border-bottom:1px solid rgba(37,45,69,.8);vertical-align:top;color:var(--text)}
.md tr:last-child td{border-bottom:none}
.md tr:nth-child(even) td{background:rgba(255,255,255,.018)}
.md tr:hover td{background:rgba(79,126,248,.05)}
.md td:first-child{font-weight:700;color:#c0cce0}
tr.row-r td{background:rgba(240,0,85,.05)!important}
tr.row-a td{background:rgba(240,165,0,.04)!important}
tr.row-g td{background:rgba(34,212,122,.04)!important}
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:4px}
.c-card{background:var(--card2);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:12px 14px}
.c-name{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.c-val{font-size:.9rem;color:var(--text);font-weight:600}
.no-results{text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem}
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero-title{font-size:1.4rem}.gbox{padding:36px 22px}
  .layout{padding:14px 10px 60px}
  .sec-body,.grp-hd,.sec-hd{padding-left:14px}
  .topbar{padding:0 10px;gap:7px}.tbrand span{display:none}
  .top-actions .btn-sm:not(.btn-lock){display:none}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <span class="gico">🏠</span>
    <h1>Закрытое досье</h1>
    <p>Конфиденциальный документ. Введите пароль для доступа.</p>
    <div class="pwrap">
      <input type="password" id="pw" placeholder="Пароль…"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="tglpw" type="button" aria-label="Показать">👁</button>
    </div>
    <button id="ubtn" type="button">🔓 Открыть досье</button>
    <div id="errmsg">Неверный пароль. Попробуйте ещё раз.</div>
    <div class="gfoot"><span>🔒 AES-256-GCM · PBKDF2-250k · client-side</span></div>
  </div>
</div>

<div id="app">
  <nav class="topbar">
    <div class="tbrand">🏠 <span id="brand-lbl">Досье</span></div>
    <div class="chip-nav" id="chip-nav"></div>
    <div class="top-actions">
      <button class="btn-sm" onclick="expandAll()">▼ Все</button>
      <button class="btn-sm" onclick="collapseAll()">▲ Свернуть</button>
      <button class="btn-sm btn-lock" onclick="lockApp()">🔒 Выйти</button>
    </div>
  </nav>
  <div class="layout">
    <div class="hero" id="hero"></div>
    <div class="searchbar">
      <span class="search-ico">🔍</span>
      <input type="text" id="search" placeholder="Поиск по разделам…" autocomplete="off">
      <button id="search-clear" onclick="clearSearch()">✕</button>
    </div>
    <div id="accordion"></div>
    <div class="no-results" id="no-results" style="display:none">Ничего не найдено</div>
  </div>
</div>

function b2u(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function doDecrypt(pw){
  const e=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b2u(PL.salt),iterations:250000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']
  );
  return new TextDecoder().decode(
    await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(PL.iv)},k,b2u(PL.ct))
  );
}

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function inl(raw){
  return esc(raw)
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(?<![*])\*(?![*])(.+?)(?<![*])\*(?![*])/g,'<em>$1</em>')
    .replace(/[`]([^`]+)[`]/g,'<code>$1</code>');
}

function pil(s){
  return s
    .replace(/🔴\s+([^\n<]{1,60})/g,'<span class="pill pr">🔴 $1</span>')
    .replace(/🟡\s+([^\n<]{1,60})/g,'<span class="pill pa">🟡 $1</span>')
    .replace(/🟢\s+([^\n<]{1,60})/g,'<span class="pill pg">🟢 $1</span>')
    .replace(/✅\s+([^\n<]{1,60})/g,'<span class="pill pg">✅ $1</span>')
    .replace(/❌\s+([^\n<]{1,60})/g,'<span class="pill pr">❌ $1</span>')
    .replace(/⚠️\s+([^\n<]{1,60})/g,'<span class="pill pa">⚠️ $1</span>')
    .replace(/🔴(?=[\s<]|$)/g,'<span class="pill pr">🔴</span>')
    .replace(/🟡(?=[\s<]|$)/g,'<span class="pill pa">🟡</span>')
    .replace(/🟢(?=[\s<]|$)/g,'<span class="pill pg">🟢</span>')
    .replace(/✅(?=[\s<]|$)/g,'<span class="pill pg">✅</span>')
    .replace(/❌(?=[\s<]|$)/g,'<span class="pill pr">❌</span>');
}

function parseBody(raw){
  const lines=raw.split('\n');
  let out='',tbl=false,tHead=true,ul=false,ol=false;
  const cul=()=>{if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}};
  const ctbl=()=>{if(tbl){out+='</tbody></table></div>';tbl=false;tHead=true}};
  function rowTint(cells){
    const j=cells.join(' ');
    if(/🔴/.test(j)) return ' class="row-r"';
    if(/🟡/.test(j)) return ' class="row-a"';
    if(/🟢/.test(j)) return ' class="row-g"';
    return '';
  }
  for(const line of lines){
    const lt=line.trim();
    if(!lt){cul();if(!tbl)out+='';continue}
    if(/^---+$/.test(lt)){cul();ctbl();continue}
    const hm=line.match(/^(#{3,4})\s+(.+)/);
    if(hm){cul();ctbl();const lv=hm[1].length;out+=`<h${lv}>${pil(inl(hm[2]))}</h${lv}>`;continue}
    if(/^>/.test(line)){
      cul();ctbl();
      out+='<blockquote>'+pil(inl(lt.replace(/^>+\s*/,'')))+'</blockquote>';
      continue;
    }
    if(lt.startsWith('|')&&lt.endsWith('|')){
      const cells=lt.split('|').slice(1,-1);
      if(cells.every(c=>/^[-: ]+$/.test(c))){
        if(tbl&&tHead){out+='</thead><tbody>';tHead=false}
        continue;
      }
      if(!tbl){cul();out+='<div class="twrap"><table><thead>';tbl=true;tHead=true}
      const tag=tHead?'th':'td';
      const tint=tHead?'':rowTint(cells);
      out+=`<tr${tint}>${cells.map(c=>'<'+tag+'>'+pil(inl(c.trim()))+'</'+tag+'>').join('')}</tr>`;
      continue;
    } else {ctbl()}
    const um=line.match(/^\s*[-*+]\s(.+)/);
    if(um){
      if(!ul){if(ol){out+='</ol>';ol=false}out+='<ul>';ul=true}
      const cb=um[1].match(/^\[([xX ])\]\s+(.+)/);
      if(cb){const chk=cb[1].toLowerCase()==='x'?' checked':'';
        out+=`<li><input type="checkbox"${chk} disabled> ${pil(inl(cb[2]))}</li>`;}
      else out+=`<li>${pil(inl(um[1]))}</li>`;
      continue;
    }
    const om=line.match(/^\s*\d+\.\s+(.+)/);
    if(om){
      if(!ol){if(ul){out+='</ul>';ul=false}out+='<ol>';ol=true}
      out+=`<li>${pil(inl(om[1]))}</li>`;
      continue;
    }
    cul();
    out+=`<p>${pil(inl(lt))}</p>`;
  }
  cul();ctbl();
  return out;
}

function parseMD(src){
  const chunks=src.replace(/\r\n/g,'\n').split(/^(?=## )/m);
  const preamble=chunks[0];
  const sections=[];
  for(const chunk of chunks.slice(1)){
    const nl=chunk.indexOf('\n');
    const heading=(nl>=0?chunk.slice(0,nl):chunk).trim();
    const body=nl>=0?chunk.slice(nl+1):'';
    const hm=heading.match(/^##\s+(\d+[a-z]?)?\.?\s*(.*)$/i);
    if(!hm) continue;
    const num=(hm[1]||'').trim();
    const rest=hm[2].trim();
    const emRe=/^([🀀-🫿☀-➿︀-﻿‍✅❌⚠️🔴🟡🟢🎯🔑🚨🏗🧠🗺🏘💳🗓⚖👥🛒🧾💬⏰📋🌍👤🚀]+)/u;
    const emM=rest.match(emRe);
    const emoji=emM?emM[1]:'📌';
    const titleText=rest.replace(emRe,'').trim();
    const isContacts=rest.toUpperCase().includes('КОНТАКТ');
    sections.push({
      num,emoji,
      title:titleText||rest,
      bodyHtml:isContacts?buildContacts(body):parseBody(body),
      isContacts
    });
  }
  const h1m=preamble.match(/^#\s+(.+)$/m);
  const h1=h1m?h1m[1].replace(/[#*]/g,'').replace(/[`]/g,'').trim():'Досье';
  const bqm=preamble.match(/^>\s*(.+)$/m);
  const sub=bqm?bqm[1]:'';
  const prm=src.match(/Цена в объявлении[^*]*\*\*([^*]+)\*\*/);
  const priceStr=prm?prm[1].trim():'—';
  return {h1,sub,priceStr,sections};
}

function buildContacts(raw){
  const rows=[];
  for(const line of raw.split('\n')){
    const lt=line.trim();
    if(!lt.startsWith('|')) continue;
    const cells=lt.split('|').slice(1,-1).map(c=>c.trim());
    if(cells.length<2||cells.every(c=>/^[-: ]+$/.test(c))) continue;
    if(/^Кто/i.test(cells[0])) continue;
    rows.push(cells);
  }
  let h='<div class="contacts-grid">';
  for(const r of rows)
    h+=`<div class="c-card"><div class="c-name">${esc(r[0])}</div><div class="c-val">${esc(r[1]||'')}</div></div>`;
  return h+'</div>';
}

/* GROUPS — updated with §27, §28, §29 */
const GROUPS=[
  {id:'dom',   ico:'🏠', label:'Дом и цена',            nums:['1','2','19','16','11','9']},
  {id:'money', ico:'💰', label:'Деньги и налоги',        nums:['7','7b','8','17','15']},
  {id:'docs',  ico:'📂', label:'Документы и готовность', nums:['27','13','20','21']},
  {id:'move',  ico:'🛒', label:'Заезд и затраты',        nums:['24','3','4','5','6','23']},
  {id:'biz',   ico:'🏗', label:'Бизнес',                 nums:['29','26','12','14']},
  {id:'deal',  ico:'📜', label:'Договор и риски',        nums:['28','25','10','18','22']},
  {id:'cont',  ico:'📇', label:'Контакты',               nums:['CONTACTS']},
];

function buildApp(markdown){
  const {h1,sub,priceStr,sections}=parseMD(markdown);

  const shortTitle=h1.replace(/🏠\s*/,'').split('—')[0].trim();
  document.getElementById('brand-lbl').textContent=shortTitle;

  document.getElementById('hero').innerHTML=`
    <div class="hero-label">🇵🇹 Центральная Португалия · Leiria</div>
    <div class="hero-title">${esc(h1)}</div>
    <div class="hero-sub">${esc(sub.slice(0,90))}</div>
    <div class="stats">
      <div class="stat s-amber"><div class="stat-ico">💰</div>
        <div class="stat-val">${esc(priceStr)}</div><div class="stat-lbl">Цена объявл.</div></div>
      <div class="stat s-green"><div class="stat-ico">🎯</div>
        <div class="stat-val">€265k</div><div class="stat-lbl">Цель торга</div></div>
      <div class="stat s-green"><div class="stat-ico">🏷️</div>
        <div class="stat-val">€0 IMT</div><div class="stat-lbl">IMT Jovem</div></div>
      <div class="stat s-red"><div class="stat-ico">🏦</div>
        <div class="stat-val">€85-115k</div><div class="stat-lbl">Нужно нала</div></div>
      <div class="stat s-red"><div class="stat-ico">📊</div>
        <div class="stat-val">10/100</div><div class="stat-lbl">Готовность</div></div>
      <div class="stat s-teal"><div class="stat-ico">📐</div>
        <div class="stat-val">139/4770</div><div class="stat-lbl">м² дом/земля</div></div>
    </div>`;

  const byNum={};
  for(const s of sections){
    byNum[s.num||'CONTACTS']=s;
    if(s.isContacts) byNum['CONTACTS']=s;
  }

  const chipNav=document.getElementById('chip-nav');
  chipNav.innerHTML='';
  for(const g of GROUPS){
    const a=document.createElement('a');
    a.className='chip';a.href='#grp-'+g.id;
    a.textContent=g.ico+' '+g.label;a.dataset.grp=g.id;
    a.addEventListener('click',e=>{
      e.preventDefault();
      const el=document.getElementById('grp-'+g.id);
      if(!el) return;
      el.scrollIntoView({behavior:'smooth',block:'start'});
      if(!el.classList.contains('open')) toggleGrp(el);
    });
    chipNav.appendChild(a);
  }

  const acc=document.getElementById('accordion');
  acc.innerHTML='';
  for(const g of GROUPS){
    const secs=g.nums.map(n=>byNum[n]).filter(Boolean);
    const grpEl=document.createElement('div');
    grpEl.className='grp';grpEl.id='grp-'+g.id;

    const hd=document.createElement('div');
    hd.className='grp-hd';
    hd.innerHTML=`<span class="grp-ico">${g.ico}</span>
      <span class="grp-title">${esc(g.label)}</span>
      <span class="grp-count">${secs.length} разд.</span>
      <span class="grp-chev">▼</span>`;
    hd.addEventListener('click',()=>toggleGrp(grpEl));
    grpEl.appendChild(hd);

    const body=document.createElement('div');
    body.className='grp-body';
    for(const s of secs){
      const secEl=document.createElement('div');
      secEl.className='sec';
      secEl.dataset.title=(s.title+' '+s.num).toLowerCase();
      const sHd=document.createElement('div');
      sHd.className='sec-hd';
      sHd.innerHTML=(s.num?
        `<div class="sec-num">${esc(s.num)}</div>`:
        `<div class="sec-num" style="font-size:.9rem">📇</div>`)+
        `<span class="sec-ico">${s.emoji}</span>
         <span class="sec-title">${esc(s.title)}</span>
         <span class="sec-chev">▼</span>`;
      sHd.addEventListener('click',()=>toggleSec(secEl));
      secEl.appendChild(sHd);
      const sBd=document.createElement('div');
      sBd.className='sec-body md';
      sBd.innerHTML=s.bodyHtml;
      secEl.appendChild(sBd);
      body.appendChild(secEl);
    }
    grpEl.appendChild(body);
    acc.appendChild(grpEl);
  }

  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id=e.target.id.replace('grp-','');
        document.querySelectorAll('.chip').forEach(c=>
          c.classList.toggle('active',c.dataset.grp===id));
      }
    });
  },{rootMargin:'-52px 0px -55% 0px',threshold:0});
  document.querySelectorAll('.grp').forEach(g=>obs.observe(g));

  const searchEl=document.getElementById('search');
  const clearBtn=document.getElementById('search-clear');
  searchEl.addEventListener('input',()=>{
    const q=searchEl.value.trim().toLowerCase();
    clearBtn.style.display=q?'block':'none';
    doSearch(q);
  });
  function doSearch(q){
    let any=false;
    document.querySelectorAll('.grp').forEach(grpEl=>{
      let match=false;
      grpEl.querySelectorAll('.sec').forEach(secEl=>{
        const hit=!q||secEl.dataset.title.includes(q)||
          (secEl.querySelector('.sec-body')?.textContent||'').toLowerCase().includes(q);
        secEl.classList.toggle('search-hidden',!hit);
        if(hit) match=true;
      });
      grpEl.classList.toggle('search-hidden',!match);
      if(match){any=true;if(q&&!grpEl.classList.contains('open'))toggleGrp(grpEl)}
    });
    document.getElementById('no-results').style.display=any?'none':'block';
  }
}

function toggleGrp(el){el.classList.toggle('open')}
function toggleSec(el){el.classList.toggle('open')}
function expandAll(){
  document.querySelectorAll('.grp:not(.search-hidden)').forEach(g=>{
    g.classList.add('open');
    g.querySelectorAll('.sec:not(.search-hidden)').forEach(s=>s.classList.add('open'));
  });
}
function collapseAll(){
  document.querySelectorAll('.grp,.sec').forEach(el=>el.classList.remove('open'));
}
function clearSearch(){
  document.getElementById('search').value='';
  document.getElementById('search-clear').style.display='none';
  document.querySelectorAll('.search-hidden').forEach(el=>el.classList.remove('search-hidden'));
  document.getElementById('no-results').style.display='none';
}

const gateEl=document.getElementById('gate'),appEl=document.getElementById('app');
const pwEl=document.getElementById('pw'),btnEl=document.getElementById('ubtn');
const errEl=document.getElementById('errmsg'),tpEl=document.getElementById('tglpw');
tpEl.onclick=()=>{pwEl.type=pwEl.type==='password'?'text':'password';
  tpEl.textContent=pwEl.type==='password'?'👁':'🙈'};
async function unlock(){
  const pw=pwEl.value.trim();if(!pw)return;
  btnEl.disabled=true;btnEl.textContent='⏳ Расшифровка…';errEl.style.display='none';
  try{
    const txt=await doDecrypt(pw);
    buildApp(txt);
    gateEl.style.display='none';appEl.style.display='block';
    window.scrollTo(0,0);pwEl.value='';
  }catch{
    errEl.style.display='block';btnEl.disabled=false;
    btnEl.textContent='🔓 Открыть досье';pwEl.select();
  }
}
btnEl.onclick=unlock;
pwEl.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function lockApp(){
  appEl.style.display='none';gateEl.style.display='flex';
  ['accordion','hero','chip-nav'].forEach(id=>document.getElementById(id).innerHTML='');
  document.getElementById('search').value='';
  pwEl.value='';btnEl.disabled=false;btnEl.textContent='🔓 Открыть досье';
}
</script>
